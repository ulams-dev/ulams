version: 2

# Weekly, grouped, few open PRs. Minor and patch updates arrive as one PR per ecosystem;
# major updates get their own PRs so they can be reviewed (or closed) one at a time.

updates:
  # Root Yarn workspace: admin, front, api/h5p, api/pdf share the root yarn.lock.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      npm-minor-patch:
        update-types: [minor, patch]
    ignore:
      # eslint 10 is live in the flat-config packages (api/h5p, api/pdf, front/sdk, front/ui, front/web),
      # but admin (umi lint, fabric) and front (vite, legacy .eslintrc) are still on eslint 8. Dependabot
      # bumps one range for every manifest, so hold the major until those two migrate (docs/ROADMAP-TODO.md).
      - dependency-name: "eslint"
        update-types: [version-update:semver-major]
      - dependency-name: "@eslint/js"
        update-types: [version-update:semver-major]
      # sharp 0.35 fails to load in the docs-site production build on the CI runner (Astro reports
      # MissingSharp) and Astro depends on sharp ^0.34.
      - dependency-name: "sharp"
        versions: [">= 0.35.0"]
      # @ant-design/pro-form 2.31.5+ ships declaration files with import("src/...") paths, so
      # ProForm.Item props resolve to any and admin typecheck fails. Held at pro-components 2.8.4.
      - dependency-name: "@ant-design/pro-components"
        versions: [">= 2.8.5, <= 2.8.10"]
      # Prettier 3 would reformat all of front/src (front pins 2.4.1, admin 2.8.8) and admin's CI step resolves
      # prettier/bin-prettier.js, which 3 does not ship. Deferred, see docs/ROADMAP-TODO.md.
      - dependency-name: "prettier"
        update-types: [version-update:semver-major]
      # @stripe/react-stripe-js 7 needs @stripe/stripe-js 10 (front has 1.x); the cart has no payment test, so
      # the pair is held together. Deferred, see docs/ROADMAP-TODO.md.
      - dependency-name: "@stripe/react-stripe-js"
        update-types: [version-update:semver-major]
      - dependency-name: "@stripe/stripe-js"
        update-types: [version-update:semver-major]
      # scorm-again 3 removes the AICC class, makes commits synchronous, flips mastery_override to true and
      # tightens CMI validation, so SCORM playback would change; there is no automated client-side SCORM
      # playback test to prove it does not. 2.6.x still receives fixes and stays inside ^2. Revisit with a
      # conformance test for front/src/lib/scorm-player. That test exists now (ADR 0197) and shows 3.4.7 still differs
      # from 2.6 in ways settings cannot pin (docs/plans/scorm-playback-tests.md section 11): owner decision.
      - dependency-name: "scorm-again"
        update-types: [version-update:semver-major]
      # @ant-design/icons 6 pairs with antd 6; antd 5 (admin) depends on icons ^5, so a 6 in admin would load two
      # copies with separate IconContext. Move it together with the antd 6 migration.
      - dependency-name: "@ant-design/icons"
        update-types: [version-update:semver-major]
      # @types/jest 30 declares Matchers<R>, while @testing-library/jest-dom 6 and @types/testing-library__jest-dom
      # declare Matchers<R = void>: the DOM matchers vanish from expect and admin typecheck fails (73 errors).
      - dependency-name: "@types/jest"
        update-types: [version-update:semver-major]
    commit-message:
      prefix: "build(deps)"

  - package-ecosystem: composer
    directory: /api
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    groups:
      composer-minor-patch:
        update-types: [minor, patch]
    ignore:
      # Framework majors follow the staged upgrade plan (docs/plans/phase-0.md, B.11).
      - dependency-name: "laravel/*"
        update-types: [version-update:semver-major]
      - dependency-name: "orchestra/*"
        update-types: [version-update:semver-major]
      - dependency-name: "phpunit/phpunit"
        update-types: [version-update:semver-major]
    commit-message:
      prefix: "build(deps)"

  # Covers the FROM lines of api/docker/php/Dockerfile, api/Dockerfile and api/Dockerfile.develop (the
  # php:8.4-fpm-alpine base). Nothing is ignored for php, so patch updates arrive too; the PHP freshness
  # workflow (.github/workflows/php-freshness.yml) reports a PHP security release the same day.
  - package-ecosystem: docker
    directories:
      - /api
      - /api/docker/php
      - /api/h5p
      - /api/pdf
      - /admin
      - /front
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    groups:
      docker:
        patterns: ["*"]
    commit-message:
      prefix: "build(deps)"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    groups:
      github-actions:
        patterns: ["*"]
    commit-message:
      prefix: "ci(deps)"
