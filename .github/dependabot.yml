version: 2

# Weekly, grouped, few open PRs. Minor and patch updates arrive as one PR per ecosystem;
# major updates get their own PRs so they can be reviewed (or closed) one at a time.

updates:
  # Root Yarn workspace: admin, front, api/h5p, api/pdf share the root yarn.lock.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      npm-minor-patch:
        update-types: [minor, patch]
    ignore:
      # eslint 10 is live in the flat-config packages (api/h5p, api/pdf, front/sdk, front/ui, front/web),
      # but admin (umi lint, fabric) and front (vite, legacy .eslintrc) are still on eslint 8. Dependabot
      # bumps one range for every manifest, so hold the major until those two migrate (docs/ROADMAP-TODO.md).
      - dependency-name: "eslint"
        update-types: [version-update:semver-major]
      - dependency-name: "@eslint/js"
        update-types: [version-update:semver-major]
      # sharp 0.35 fails to load in the docs-site production build on the CI runner (Astro reports
      # MissingSharp) and Astro depends on sharp ^0.34.
      - dependency-name: "sharp"
        versions: [">= 0.35.0"]
      # @ant-design/pro-form 2.31.5+ ships declaration files with import("src/...") paths, so
      # ProForm.Item props resolve to any and admin typecheck fails. Held at pro-components 2.8.4.
      - dependency-name: "@ant-design/pro-components"
        versions: [">= 2.8.5, <= 2.8.10"]
    commit-message:
      prefix: "build(deps)"

  - package-ecosystem: composer
    directory: /api
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    groups:
      composer-minor-patch:
        update-types: [minor, patch]
    ignore:
      # Framework majors follow the staged upgrade plan (docs/plans/phase-0.md, B.11).
      - dependency-name: "laravel/*"
        update-types: [version-update:semver-major]
      - dependency-name: "orchestra/*"
        update-types: [version-update:semver-major]
      - dependency-name: "phpunit/phpunit"
        update-types: [version-update:semver-major]
    commit-message:
      prefix: "build(deps)"

  - package-ecosystem: docker
    directories:
      - /api
      - /api/docker/php
      - /api/h5p
      - /api/pdf
      - /admin
      - /front
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    groups:
      docker:
        patterns: ["*"]
    commit-message:
      prefix: "build(deps)"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    groups:
      github-actions:
        patterns: ["*"]
    commit-message:
      prefix: "ci(deps)"
