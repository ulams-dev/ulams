name: Feature request
description: Suggest a new feature or a change to an existing one.
title: "feat: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the suggestion. Please check the
        [roadmap](https://github.com/ulams-dev/ulams/blob/main/docs/ROADMAP-TODO.md) first: the
        feature may already be planned. Larger changes need an approved plan, and decisions an
        ADR, before implementation starts (see [CONTRIBUTING.md](https://github.com/ulams-dev/ulams/blob/main/CONTRIBUTING.md)).
  - type: dropdown
    id: audience
    attributes:
      label: Who is it for
      multiple: true
      options:
        - Learners
        - Course authors and tutors
        - Administrators
        - Developers and integrators
        - Operators (self-hosting)
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How it could work. Mention affected apps, API endpoints or packages if you know them.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches or workarounds, and why they fall short.
  - type: input
    id: roadmap
    attributes:
      label: Related roadmap item
      description: The phase or item in docs/ROADMAP-TODO.md this belongs to, if any.
  - type: checkboxes
    id: contribution
    attributes:
      label: Contribution
      options:
        - label: I would like to work on this myself.
          required: false
