name: Publish images

# Builds the ulams container images and pushes them to GitHub Container Registry as
# ghcr.io/ulams-dev/<name>, multi-arch (linux/amd64, linux/arm64), with provenance and an SBOM.
#
# Each platform is built natively (amd64 on ubuntu-latest, arm64 on ubuntu-24.04-arm; no QEMU, whose
# emulation crashed Node and the C compiler), pushed by digest, and one merge job per image publishes
# the multi-arch tags with `docker buildx imagetools create` (Docker's multi-platform pattern).
# A dispatch from a branch gets only the <branch> and sha tags: latest, 8.4, the PHP version and the
# release tags are enabled on the default branch and v* tags only.
#
# Supply chain (ADR 0108, .github/scripts/supply-chain.sh, job `supply-chain` after the image jobs): the pushed digest is scanned with Trivy
# (fixable CRITICAL findings fail the job, and the image is then never signed), signed keyless with cosign
# (GitHub OIDC identity of this workflow; the signature is on the index, so it also covers the BuildKit SBOM
# and provenance attestations the index lists), and verified with the command operators use. The SBOM is
# also attached as a cosign attestation (best effort: a failure there warns, the signature is what counts).
# Verify: docs "Operators > Hardening".
#
# Tags: sha-<short>, <branch>, <version> and <major>.<minor> on v* tags, latest on main.
#
# Licences (see LICENSING.md):
# - h5p is GPL-3.0-or-later. Publishing the image conveys GPL software: the image ships the
#   licence text, and its labels point at the exact source revision of this repository and at
#   the pinned H5P core and editor commits. That corresponding source must stay available
#   (keep the repository public, or answer source requests) for as long as the image is offered.
# - php and api contain GPL command-line tools (ffmpeg, pngquant, gifsicle, jpegoptim) from
#   Alpine packages; api/docker/php/NOTICE inside the image lists them and where their source is.

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE_PREFIX: ghcr.io/ulams-dev
  # Put the OCI labels on the multi-arch index too, so GHCR shows description and licence.
  DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index
  METADATA_TAGS: |
    type=sha
    type=ref,event=branch
    type=semver,pattern={{version}}
    type=semver,pattern={{major}}.{{minor}}
    type=raw,value=latest,enable={{is_default_branch}}

jobs:
  # Exact PHP and Alpine version of the official base image, for the php image tag and label.
  php-version:
    name: php version
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.php-version.outputs.version }}
      alpine: ${{ steps.php-version.outputs.alpine }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/docker-hub-mirror
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          token: ${{ secrets.DOCKERHUB_TOKEN }}

      # The base tag moves with every PHP release: record the exact version the image is built on and tag it
      # (immutable-looking tag next to the moving 8.4), so a deployment can say which PHP it runs.
      - name: PHP version of the base image
        id: php-version
        run: |
          base=$(sed -n 's/^ARG PHP_IMAGE=//p' api/docker/php/Dockerfile)
          docker pull "$base"
          version=$(docker run --rm "$base" php -r 'echo PHP_VERSION;')
          echo "$base is PHP $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          alpine=$(docker run --rm "$base" cat /etc/alpine-release)
          echo "alpine=$alpine" >> "$GITHUB_OUTPUT"

  php:
    name: php (${{ matrix.slug }})
    needs: php-version
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    env:
      DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest
    strategy:
      fail-fast: true
      matrix:
        platform: [linux/amd64, linux/arm64]
        include:
          - { platform: linux/amd64, slug: amd64, runner: ubuntu-latest }
          - { platform: linux/arm64, slug: arm64, runner: ubuntu-24.04-arm }
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/docker-hub-mirror
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          token: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v4
        with:
          # The docker-container builder ignores the daemon's mirror setting; give it its own.
          buildkitd-config-inline: |
            [registry."docker.io"]
              mirrors = ["mirror.gcr.io"]

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: PHP base metadata
        id: php-meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_PREFIX }}/php
          flavor: latest=false
          tags: |
            ${{ env.METADATA_TAGS }}
            type=raw,value=8.4,enable={{is_default_branch}}
            type=raw,value=${{ needs.php-version.outputs.version }},enable={{is_default_branch}}
          labels: |
            org.opencontainers.image.title=ulams php
            org.opencontainers.image.description=PHP 8.4 FPM runtime of the ulams API (official php:8.4-fpm-alpine plus extensions and tools). Third-party notices: /usr/local/src/ulams-php/NOTICE
            org.opencontainers.image.licenses=Apache-2.0
            org.ulams.alpine-release=${{ needs.php-version.outputs.alpine }}
          annotations: |
            org.opencontainers.image.title=ulams php
            org.opencontainers.image.description=PHP 8.4 FPM runtime of the ulams API
            org.opencontainers.image.licenses=Apache-2.0

      - name: Build and push PHP base by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: api/docker/php
          file: api/docker/php/Dockerfile
          platforms: ${{ matrix.platform }}
          # Always take the newest official base layers: a cached FROM would keep an unpatched PHP.
          pull: true
          labels: ${{ steps.php-meta.outputs.labels }}
          annotations: ${{ steps.php-meta.outputs.annotations }}
          outputs: type=image,name=${{ env.IMAGE_PREFIX }}/php,push-by-digest=true,name-canonical=true,push=true
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=php-${{ matrix.slug }}
          cache-to: type=gha,scope=php-${{ matrix.slug }},mode=max

      - name: Export digest
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          digest="${{ steps.build.outputs.digest }}"
          touch "$RUNNER_TEMP/digests/${digest#sha256:}"
      - uses: actions/upload-artifact@v7
        with:
          name: digests-php-${{ matrix.slug }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  php-merge:
    name: php image
    needs: [php-version, php]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DOCKER_METADATA_ANNOTATIONS_LEVELS: index
    outputs:
      digest: ${{ steps.merge.outputs.digest }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-php-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: PHP base metadata
        id: php-meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_PREFIX }}/php
          flavor: latest=false
          tags: |
            ${{ env.METADATA_TAGS }}
            type=raw,value=8.4,enable={{is_default_branch}}
            type=raw,value=${{ needs.php-version.outputs.version }},enable={{is_default_branch}}
          labels: |
            org.opencontainers.image.title=ulams php
            org.opencontainers.image.description=PHP 8.4 FPM runtime of the ulams API (official php:8.4-fpm-alpine plus extensions and tools). Third-party notices: /usr/local/src/ulams-php/NOTICE
            org.opencontainers.image.licenses=Apache-2.0
            org.ulams.alpine-release=${{ needs.php-version.outputs.alpine }}
          annotations: |
            org.opencontainers.image.title=ulams php
            org.opencontainers.image.description=PHP 8.4 FPM runtime of the ulams API
            org.opencontainers.image.licenses=Apache-2.0


      - name: Create the multi-arch image
        id: merge
        working-directory: ${{ runner.temp }}/digests
        env:
          IMAGE: ${{ env.IMAGE_PREFIX }}/php
        run: |
          set -euo pipefail
          mapfile -t args < <(jq -r '(.tags[] | "-t\n" + .), (.annotations[]? | select(startswith("index:")) | "--annotation\n" + .)' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          # shellcheck disable=SC2046
          docker buildx imagetools create "${args[@]}" $(printf "$IMAGE@sha256:%s " *)
          first=$(jq -r '.tags[0]' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          docker buildx imagetools inspect "$first"
          echo "digest=$(docker buildx imagetools inspect "$first" --format '{{json .Manifest}}' | jq -r .digest)" >> "$GITHUB_OUTPUT"

      # Part of the written GPL source offer (api/docker/php/NOTICE): the exact Alpine packages of the image.
      - name: Alpine package list in the run summary
        env:
          IMAGE: ${{ env.IMAGE_PREFIX }}/php@${{ steps.merge.outputs.digest }}
        run: |
          docker pull "$IMAGE"
          {
            echo "<details><summary>Alpine packages in the PHP image (GPL source offer)</summary>"
            echo
            echo '```'
            docker run --rm "$IMAGE" cat /usr/share/doc/ulams/apk-packages.txt
            echo '```'
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"

  # The API image is built on the published PHP runtime image: api waits for php image.
  api:
    name: api (${{ matrix.slug }})
    needs: php-merge
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    env:
      DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest
    strategy:
      fail-fast: true
      matrix:
        platform: [linux/amd64, linux/arm64]
        include:
          - { platform: linux/amd64, slug: amd64, runner: ubuntu-latest }
          - { platform: linux/arm64, slug: arm64, runner: ubuntu-24.04-arm }
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/docker-hub-mirror
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          token: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v4
        with:
          # The docker-container builder ignores the daemon's mirror setting; give it its own.
          buildkitd-config-inline: |
            [registry."docker.io"]
              mirrors = ["mirror.gcr.io"]

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: API metadata
        id: api-meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_PREFIX }}/api
          flavor: latest=false
          tags: ${{ env.METADATA_TAGS }}
          labels: |
            org.opencontainers.image.title=ulams api
            org.opencontainers.image.description=ulams Laravel API (php-fpm, Horizon, queue workers, scheduler)
            org.opencontainers.image.licenses=Apache-2.0
          annotations: |
            org.opencontainers.image.title=ulams api
            org.opencontainers.image.description=ulams Laravel API (php-fpm, Horizon, queue workers, scheduler)
            org.opencontainers.image.licenses=Apache-2.0

      - name: Build and push API by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: api
          file: api/Dockerfile
          # Pinned by digest: the API is built on exactly the base published above.
          build-args: |
            BASE_IMAGE=${{ env.IMAGE_PREFIX }}/php@${{ needs.php-merge.outputs.digest }}
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.api-meta.outputs.labels }}
          annotations: ${{ steps.api-meta.outputs.annotations }}
          outputs: type=image,name=${{ env.IMAGE_PREFIX }}/api,push-by-digest=true,name-canonical=true,push=true
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=api-${{ matrix.slug }}
          cache-to: type=gha,scope=api-${{ matrix.slug }},mode=max

      - name: Export digest
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          digest="${{ steps.build.outputs.digest }}"
          touch "$RUNNER_TEMP/digests/${digest#sha256:}"
      - uses: actions/upload-artifact@v7
        with:
          name: digests-api-${{ matrix.slug }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  api-merge:
    name: php + api
    needs: api
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DOCKER_METADATA_ANNOTATIONS_LEVELS: index
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-api-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: API metadata
        id: api-meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_PREFIX }}/api
          flavor: latest=false
          tags: ${{ env.METADATA_TAGS }}
          labels: |
            org.opencontainers.image.title=ulams api
            org.opencontainers.image.description=ulams Laravel API (php-fpm, Horizon, queue workers, scheduler)
            org.opencontainers.image.licenses=Apache-2.0
          annotations: |
            org.opencontainers.image.title=ulams api
            org.opencontainers.image.description=ulams Laravel API (php-fpm, Horizon, queue workers, scheduler)
            org.opencontainers.image.licenses=Apache-2.0


      - name: Create the multi-arch image
        id: merge
        working-directory: ${{ runner.temp }}/digests
        env:
          IMAGE: ${{ env.IMAGE_PREFIX }}/api
        run: |
          set -euo pipefail
          mapfile -t args < <(jq -r '(.tags[] | "-t\n" + .), (.annotations[]? | select(startswith("index:")) | "--annotation\n" + .)' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          # shellcheck disable=SC2046
          docker buildx imagetools create "${args[@]}" $(printf "$IMAGE@sha256:%s " *)
          first=$(jq -r '.tags[0]' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          docker buildx imagetools inspect "$first"
          echo "digest=$(docker buildx imagetools inspect "$first" --format '{{json .Manifest}}' | jq -r .digest)" >> "$GITHUB_OUTPUT"

  # Node services and frontends, all built from the repository root (one root yarn.lock).
  apps:
    name: ${{ matrix.name }} (${{ matrix.slug }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    env:
      DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest
    strategy:
      fail-fast: false
      matrix:
        name: [h5p, pdf, admin, front, mjml, web]
        platform: [linux/amd64, linux/arm64]
        include:
          - { platform: linux/amd64, slug: amd64, runner: ubuntu-latest }
          - { platform: linux/arm64, slug: arm64, runner: ubuntu-24.04-arm }
          - name: h5p
            file: api/h5p/Dockerfile
            licenses: GPL-3.0-or-later
            description: "ulams H5P service (Lumi h5p-nodejs-library). GPL-3.0-or-later: licence at /app/api/h5p/LICENSE; corresponding source is this repository at the revision label (api/h5p) plus the H5P core and editor commits in the dev.ulams.h5p.* labels"
          - name: pdf
            file: api/pdf/Dockerfile
            licenses: MIT
            description: ulams PDF renderer (pdfme) for certificates and PDF templates
          - name: admin
            file: admin/Dockerfile
            licenses: MIT
            description: ulams admin panel (static build on nginx-unprivileged, port 8080; REACT_APP_* written to runtime-config.json at start)
          - name: front
            file: front/Dockerfile
            licenses: MIT
            description: ulams learner front (static build on nginx-unprivileged, port 8080; VITE_APP_* written to runtime-config.json at start)
          - name: mjml
            file: deploy/stack/mjml/Dockerfile
            licenses: MIT
            description: ulams native MJML email renderer (private HTTP service, /v1/render)
          - name: web
            file: front/web/Dockerfile
            licenses: MIT
            description: ulams reference frontend (Astro SSR, Node standalone server)
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/docker-hub-mirror
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          token: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v4
        with:
          # The docker-container builder ignores the daemon's mirror setting; give it its own.
          buildkitd-config-inline: |
            [registry."docker.io"]
              mirrors = ["mirror.gcr.io"]

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_PREFIX }}/${{ matrix.name }}
          flavor: latest=false
          tags: ${{ env.METADATA_TAGS }}
          labels: |
            org.opencontainers.image.title=ulams ${{ matrix.name }}
            org.opencontainers.image.description=${{ matrix.description }}
            org.opencontainers.image.licenses=${{ matrix.licenses }}
          annotations: |
            org.opencontainers.image.title=ulams ${{ matrix.name }}
            org.opencontainers.image.description=${{ matrix.description }}
            org.opencontainers.image.licenses=${{ matrix.licenses }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.file }}
          build-args: |
            APP_VERSION=${{ steps.meta.outputs.version }}
            ADMIN_VERSION=${{ steps.meta.outputs.version }}
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          outputs: type=image,name=${{ env.IMAGE_PREFIX }}/${{ matrix.name }},push-by-digest=true,name-canonical=true,push=true
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=${{ matrix.name }}-${{ matrix.slug }}
          cache-to: type=gha,scope=${{ matrix.name }}-${{ matrix.slug }},mode=max

      - name: Export digest
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          digest="${{ steps.build.outputs.digest }}"
          touch "$RUNNER_TEMP/digests/${digest#sha256:}"
      - uses: actions/upload-artifact@v7
        with:
          name: digests-${{ matrix.name }}-${{ matrix.slug }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  apps-merge:
    name: ${{ matrix.name }}
    needs: apps
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DOCKER_METADATA_ANNOTATIONS_LEVELS: index
    strategy:
      fail-fast: false
      matrix:
        name: [h5p, pdf, admin, front, mjml, web]
        include:
          - name: h5p
            file: api/h5p/Dockerfile
            licenses: GPL-3.0-or-later
            description: "ulams H5P service (Lumi h5p-nodejs-library). GPL-3.0-or-later: licence at /app/api/h5p/LICENSE; corresponding source is this repository at the revision label (api/h5p) plus the H5P core and editor commits in the dev.ulams.h5p.* labels"
          - name: pdf
            file: api/pdf/Dockerfile
            licenses: MIT
            description: ulams PDF renderer (pdfme) for certificates and PDF templates
          - name: admin
            file: admin/Dockerfile
            licenses: MIT
            description: ulams admin panel (static build on nginx-unprivileged, port 8080; REACT_APP_* written to runtime-config.json at start)
          - name: front
            file: front/Dockerfile
            licenses: MIT
            description: ulams learner front (static build on nginx-unprivileged, port 8080; VITE_APP_* written to runtime-config.json at start)
          - name: mjml
            file: deploy/stack/mjml/Dockerfile
            licenses: MIT
            description: ulams native MJML email renderer (private HTTP service, /v1/render)
          - name: web
            file: front/web/Dockerfile
            licenses: MIT
            description: ulams reference frontend (Astro SSR, Node standalone server)
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-${{ matrix.name }}-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_PREFIX }}/${{ matrix.name }}
          flavor: latest=false
          tags: ${{ env.METADATA_TAGS }}
          labels: |
            org.opencontainers.image.title=ulams ${{ matrix.name }}
            org.opencontainers.image.description=${{ matrix.description }}
            org.opencontainers.image.licenses=${{ matrix.licenses }}
          annotations: |
            org.opencontainers.image.title=ulams ${{ matrix.name }}
            org.opencontainers.image.description=${{ matrix.description }}
            org.opencontainers.image.licenses=${{ matrix.licenses }}


      - name: Create the multi-arch image
        id: merge
        working-directory: ${{ runner.temp }}/digests
        env:
          IMAGE: ${{ env.IMAGE_PREFIX }}/${{ matrix.name }}
        run: |
          set -euo pipefail
          mapfile -t args < <(jq -r '(.tags[] | "-t\n" + .), (.annotations[]? | select(startswith("index:")) | "--annotation\n" + .)' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          # shellcheck disable=SC2046
          docker buildx imagetools create "${args[@]}" $(printf "$IMAGE@sha256:%s " *)
          first=$(jq -r '.tags[0]' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          docker buildx imagetools inspect "$first"
          echo "digest=$(docker buildx imagetools inspect "$first" --format '{{json .Manifest}}' | jq -r .digest)" >> "$GITHUB_OUTPUT"

  # Supply chain (ADR 0108): runs after the image jobs and works on the PUBLISHED images, so it does not care
  # how they were built. The digest of each image is read from its sha-<short> tag (pushed on every run by the merge jobs).
  # Scan first: a fixable CRITICAL finding fails the job and the image stays unsigned.
  supply-chain:
    name: sign ${{ matrix.image }}
    needs: [php-merge, api-merge, apps-merge]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
      # Keyless signing: the job asks GitHub for an OIDC token, Sigstore turns it into a short-lived certificate.
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        image: [php, api, h5p, pdf, admin, front, mjml, web]
    env:
      TRIVY_USERNAME: ${{ github.actor }}
      TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      # Pinned by commit (v4.1.2); the cosign release it installs is pinned here.
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6
        with:
          cosign-release: v3.1.3
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Trivy database cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/trivy-ulams
          key: trivy-db-${{ github.run_id }}
          restore-keys: trivy-db-
      - name: Digest of this commit's image
        id: ref
        run: |
          tag="sha-$(printf '%s' "$GITHUB_SHA" | cut -c1-7)"
          digest="$(docker buildx imagetools inspect "$IMAGE_PREFIX/${{ matrix.image }}:$tag" --format '{{ json .Manifest }}' | jq -r .digest)"
          echo "$IMAGE_PREFIX/${{ matrix.image }}:$tag is $digest"
          echo "ref=$IMAGE_PREFIX/${{ matrix.image }}@$digest" >> "$GITHUB_OUTPUT"
      - name: Scan, sign and verify
        env:
          REF: ${{ steps.ref.outputs.ref }}
        run: |
          sh .github/scripts/supply-chain.sh scan "$REF"
          sh .github/scripts/supply-chain.sh sign "$REF"
          sh .github/scripts/supply-chain.sh verify "$REF"
      - name: SBOM attestation
        continue-on-error: true
        env:
          REF: ${{ steps.ref.outputs.ref }}
        run: |
          sh .github/scripts/supply-chain.sh attest "$REF"
          VERIFY_ATTESTATION=1 sh .github/scripts/supply-chain.sh verify "$REF"
