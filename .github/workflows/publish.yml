name: Publish images

# Builds the ulams container images and pushes them to GitHub Container Registry as
# ghcr.io/ulams-dev/<name>, multi-arch (linux/amd64, linux/arm64), with provenance and an SBOM.
#
# Tags: sha-<short>, <branch>, <version> and <major>.<minor> on v* tags, latest on main.
#
# Licences (see LICENSING.md):
# - h5p is GPL-3.0-or-later. Publishing the image conveys GPL software: the image ships the
#   licence text, and its labels point at the exact source revision of this repository and at
#   the pinned H5P core and editor commits. That corresponding source must stay available
#   (keep the repository public, or answer source requests) for as long as the image is offered.
# - php and api contain GPL command-line tools (ffmpeg, pngquant, gifsicle, jpegoptim) from
#   Alpine packages; api/docker/php/NOTICE inside the image lists them and where their source is.

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE_PREFIX: ghcr.io/ulams-dev
  PLATFORMS: linux/amd64,linux/arm64
  # Put the OCI labels on the multi-arch index too, so GHCR shows description and licence.
  DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index
  METADATA_TAGS: |
    type=sha
    type=ref,event=branch
    type=semver,pattern={{version}}
    type=semver,pattern={{major}}.{{minor}}
    type=raw,value=latest,enable={{is_default_branch}}

jobs:
  # The API image is built on the published PHP runtime image, so both run in one job, in order.
  api:
    name: php + api
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: PHP base metadata
        id: php-meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_PREFIX }}/php
          flavor: latest=false
          tags: |
            ${{ env.METADATA_TAGS }}
            type=raw,value=8.4,enable={{is_default_branch}}
          labels: |
            org.opencontainers.image.title=ulams php
            org.opencontainers.image.description=PHP 8.4 FPM runtime of the ulams API (official php:8.4-fpm-alpine plus extensions and tools). Third-party notices: /usr/local/src/ulams-php/NOTICE
            org.opencontainers.image.licenses=Apache-2.0
          annotations: |
            org.opencontainers.image.title=ulams php
            org.opencontainers.image.description=PHP 8.4 FPM runtime of the ulams API
            org.opencontainers.image.licenses=Apache-2.0

      - name: Build and push PHP base
        id: php
        uses: docker/build-push-action@v7
        with:
          context: api/docker/php
          file: api/docker/php/Dockerfile
          platforms: ${{ env.PLATFORMS }}
          push: true
          tags: ${{ steps.php-meta.outputs.tags }}
          labels: ${{ steps.php-meta.outputs.labels }}
          annotations: ${{ steps.php-meta.outputs.annotations }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=php
          cache-to: type=gha,scope=php,mode=max

      - name: API metadata
        id: api-meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_PREFIX }}/api
          flavor: latest=false
          tags: ${{ env.METADATA_TAGS }}
          labels: |
            org.opencontainers.image.title=ulams api
            org.opencontainers.image.description=ulams Laravel API (php-fpm, Horizon, queue workers, scheduler)
            org.opencontainers.image.licenses=Apache-2.0
          annotations: |
            org.opencontainers.image.title=ulams api
            org.opencontainers.image.description=ulams Laravel API (php-fpm, Horizon, queue workers, scheduler)
            org.opencontainers.image.licenses=Apache-2.0

      - name: Build and push API
        uses: docker/build-push-action@v7
        with:
          context: api
          file: api/Dockerfile
          # Pinned by digest: the API is built on exactly the base pushed above.
          build-args: |
            BASE_IMAGE=${{ env.IMAGE_PREFIX }}/php@${{ steps.php.outputs.digest }}
          platforms: ${{ env.PLATFORMS }}
          push: true
          tags: ${{ steps.api-meta.outputs.tags }}
          labels: ${{ steps.api-meta.outputs.labels }}
          annotations: ${{ steps.api-meta.outputs.annotations }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max

  # Node services and frontends, all built from the repository root (one root yarn.lock).
  apps:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: h5p
            file: api/h5p/Dockerfile
            licenses: GPL-3.0-or-later
            description: "ulams H5P service (Lumi h5p-nodejs-library). GPL-3.0-or-later: licence at /app/api/h5p/LICENSE; corresponding source is this repository at the revision label (api/h5p) plus the H5P core and editor commits in the dev.ulams.h5p.* labels"
          - name: pdf
            file: api/pdf/Dockerfile
            licenses: MIT
            description: ulams PDF renderer (pdfme) for certificates and PDF templates
          - name: admin
            file: admin/Dockerfile
            licenses: MIT
            description: ulams admin panel (static build on nginx-unprivileged, port 8080; REACT_APP_* written to runtime-config.json at start)
          - name: front
            file: front/Dockerfile
            licenses: MIT
            description: ulams learner front (static build on nginx-unprivileged, port 8080; VITE_APP_* written to runtime-config.json at start)
          - name: web
            file: front/web/Dockerfile
            licenses: MIT
            description: ulams reference frontend (Astro SSR, Node standalone server)
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_PREFIX }}/${{ matrix.name }}
          flavor: latest=false
          tags: ${{ env.METADATA_TAGS }}
          labels: |
            org.opencontainers.image.title=ulams ${{ matrix.name }}
            org.opencontainers.image.description=${{ matrix.description }}
            org.opencontainers.image.licenses=${{ matrix.licenses }}
          annotations: |
            org.opencontainers.image.title=ulams ${{ matrix.name }}
            org.opencontainers.image.description=${{ matrix.description }}
            org.opencontainers.image.licenses=${{ matrix.licenses }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.file }}
          build-args: |
            APP_VERSION=${{ steps.meta.outputs.version }}
            ADMIN_VERSION=${{ steps.meta.outputs.version }}
          platforms: ${{ env.PLATFORMS }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,scope=${{ matrix.name }},mode=max
