name: Nightly conformance

# Round trips against real third-party software, too slow or too heavy for every push
# (docs/plans/phase-1.md, M1.9). Opt-in:
#   - on schedule only when the repository variable NIGHTLY_CONFORMANCE is "true";
#   - by hand (Actions -> Nightly conformance -> Run workflow), choosing the suites.
# Fixtures, compose services and scripts: .github/conformance/. Nothing here publishes.

on:
  schedule:
    - cron: "30 2 * * *"
  workflow_dispatch:
    inputs:
      adapt:
        description: Adapt Path B through the real build worker
        type: boolean
        default: true
      moodle:
        description: LTI 1.3 round trips with Moodle 5.0 (both directions)
        type: boolean
        default: true
      pg_upgrade:
        description: Upgrade a seeded PostgreSQL 12 cluster to 17 (dump and restore, plus logical replication)
        type: boolean
        default: true
      tenancy:
        description: Two real tenants over HTTP through Caddy (data and tokens do not cross)
        type: boolean
        default: true
      sso:
        description: OpenID Connect sign-in with Keycloak (the reusable workflow identity-keycloak.yml)
        type: boolean
        default: true
      saltire:
        description: LTI 1.3 against saLTIre (needs an operator, see the job)
        type: boolean
        default: false
      saltire_platform:
        description: >-
          saLTIre platform as JSON, from its Platform page: {"issuer", "client_id",
          "deployment_id", "auth_login_url", "auth_token_url", "jwks_url"}
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: nightly-conformance
  cancel-in-progress: false

env:
  # Same API test environment as ci.yml's PHPUnit job.
  DB_CONNECTION: pgsql
  DB_HOST: 127.0.0.1
  DB_PORT: "5432"
  DB_DATABASE: default
  DB_USERNAME: default
  DB_PASSWORD: secret
  REDIS_HOST: 127.0.0.1
  REDIS_PORT: "6379"
  REDIS_PASSWORD: ""
  XDEBUG_MODE: "off"
  PLAYWRIGHT_VERSION: 1.63.0

jobs:
  adapt:
    name: Adapt build worker round trip
    if: >-
      (github.event_name == 'schedule' && vars.NIGHTLY_CONFORMANCE == 'true') ||
      (github.event_name == 'workflow_dispatch' && inputs.adapt)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    # The docker-hub-mirror step restarts the Docker daemon, which stops service containers without a
    # restart policy; --restart always brings postgres and valkey back.
    services:
      postgres:
        image: postgres:17.11-alpine
        env:
          POSTGRES_DB: default
          POSTGRES_USER: default
          POSTGRES_PASSWORD: secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U default -d default"
          --health-interval 5s --health-timeout 5s --health-retries 20
          --restart always
      valkey:
        image: valkey/valkey:8-alpine
        ports:
          - 6379:6379
        options: --restart always
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/docker-hub-mirror
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          token: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Worker unit tests
        working-directory: api/adapt-builder
        run: node --test "test/*.test.mjs"

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: apcu, bcmath, exif, gd, intl, pcntl, pdo_pgsql, redis, zip
          ini-values: memory_limit=2G
          coverage: none
          tools: composer:v2

      - name: Prepare the API
        working-directory: api
        run: |
          cp docker/envs/.env.ci.postgres .env
          for i in $(seq 1 30); do
            if php -r 'try { new PDO("pgsql:host=" . getenv("DB_HOST") . ";port=" . getenv("DB_PORT") . ";dbname=" . getenv("DB_DATABASE"), getenv("DB_USERNAME"), getenv("DB_PASSWORD")); } catch (Throwable $e) { fwrite(STDERR, $e->getMessage() . "\n"); exit(1); }'; then
              break
            fi
            if [ "$i" -eq 30 ]; then
              echo "PostgreSQL at ${DB_HOST}:${DB_PORT} did not accept a connection after 30 attempts." >&2
              exit 1
            fi
            sleep 2
          done
          composer install --no-interaction --no-progress --prefer-dist
          php artisan migrate:fresh --force
          php artisan db:seed --force --class="Database\Seeders\PermissionsSeeder"
          php artisan passport:keys --force
          php artisan passport:client --personal --no-interaction
          mkdir -p vendor/orchestra/testbench-core/laravel/storage
          cp storage/oauth-private.key storage/oauth-public.key vendor/orchestra/testbench-core/laravel/storage/
          php artisan migrate --force --path=packages/courses/tests/Database/Migrations

      - name: Build and start the worker (adapt_framework, needs network at build time only)
        run: |
          docker compose -f .github/conformance/compose.yml --profile adapt up -d --build --wait adapt-builder
          curl -fsS http://127.0.0.1:18090/health

      - name: Source -> real build -> SCORM import (Path A)
        working-directory: api
        env:
          ADAPT_BUILDER_E2E_URL: http://127.0.0.1:18090
          ADAPT_BUILDER_E2E_TOKEN: conformance-token
        run: ./vendor/bin/phpunit packages/adapt/tests/Conformance --fail-on-skipped

      - name: Worker logs
        if: failure()
        run: docker compose -f .github/conformance/compose.yml --profile adapt logs adapt-builder

  moodle:
    name: LTI 1.3 with Moodle
    if: >-
      (github.event_name == 'schedule' && vars.NIGHTLY_CONFORMANCE == 'true') ||
      (github.event_name == 'workflow_dispatch' && inputs.moodle)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:17.11-alpine
        env:
          POSTGRES_DB: default
          POSTGRES_USER: default
          POSTGRES_PASSWORD: secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U default -d default"
          --health-interval 5s --health-timeout 5s --health-retries 20
          --restart always
      valkey:
        image: valkey/valkey:8-alpine
        ports:
          - 6379:6379
        options: --restart always
    env:
      # ulams serves http://ulams.test:18000 on the host; Moodle reaches it through host-gateway
      APP_URL: http://ulams.test:18000
      FRONTEND_URL: http://front.test:18001
      TENANCY_PLATFORM_HOSTS: ulams.test,127.0.0.1,localhost
      # development switch: Moodle runs on http and a private address
      LTI_ALLOW_INSECURE_URLS: "true"
      # grade passback during the request, so the test can check Moodle right after
      QUEUE_CONNECTION: sync
      CACHE_DRIVER: array
      CACHE_STORE: array
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/docker-hub-mirror
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          token: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Configure local test hostnames
        run: |
          echo "127.0.0.1 moodle.test ulams.test front.test" | sudo tee -a /etc/hosts

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Playwright (Chromium only, outside the workspace)
        run: |
          npm install --no-save --no-audit --no-fund --prefix /tmp/pw "playwright@${PLAYWRIGHT_VERSION}"
          /tmp/pw/node_modules/.bin/playwright install --with-deps chromium

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: apcu, bcmath, exif, gd, intl, pcntl, pdo_pgsql, redis, zip
          ini-values: memory_limit=1G
          coverage: none
          tools: composer:v2

      - name: Prepare and start the API
        working-directory: api
        run: |
          cp docker/envs/.env.ci.postgres .env
          for i in $(seq 1 30); do
            if php -r 'try { new PDO("pgsql:host=" . getenv("DB_HOST") . ";port=" . getenv("DB_PORT") . ";dbname=" . getenv("DB_DATABASE"), getenv("DB_USERNAME"), getenv("DB_PASSWORD")); } catch (Throwable $e) { fwrite(STDERR, $e->getMessage() . "\n"); exit(1); }'; then
              break
            fi
            if [ "$i" -eq 30 ]; then
              echo "PostgreSQL at ${DB_HOST}:${DB_PORT} did not accept a connection after 30 attempts." >&2
              exit 1
            fi
            sleep 2
          done
          composer install --no-interaction --no-progress --prefer-dist
          php artisan migrate:fresh --force
          php artisan db:seed --force --class="Database\Seeders\PermissionsSeeder"
          php artisan passport:keys --force
          php artisan passport:client --personal --no-interaction
          # the built-in server with workers: during a passback Moodle calls our JWKS back
          PHP_CLI_SERVER_WORKERS=6 nohup php -S 0.0.0.0:18000 -t public \
            vendor/laravel/framework/src/Illuminate/Foundation/resources/server.php > /tmp/ulams.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS -o /dev/null http://ulams.test:18000/api/lti/jwks && break; sleep 1; done

      - name: Start Moodle 5.0 (first start installs it, a few minutes)
        run: docker compose -f .github/conformance/compose.yml --profile lti up -d

      - name: Wait for Moodle
        run: |
          for i in $(seq 1 90); do
            if curl -fsS -o /dev/null http://moodle.test:18080/login/index.php; then exit 0; fi
            sleep 5
          done
          docker compose -f .github/conformance/compose.yml --profile lti logs moodle | tail -100
          exit 1

      - name: Round trips (Moodle -> ulams, ulams -> Moodle)
        env:
          NODE_PATH: /tmp/pw/node_modules
        run: sh .github/conformance/lti/run-moodle.sh

      # a fake platform page embeds the tool login and answers lti.capabilities / put_data / get_data;
      # the API fetches its JWKS from the runner host (LTI_ALLOW_INSECURE_URLS)
      - name: Client Side postMessage Storage (fake platform, browser)
        env:
          NODE_PATH: /tmp/pw/node_modules
        run: sh .github/conformance/lti/run-client-side-storage.sh

      - name: Logs
        if: failure()
        run: |
          tail -200 /tmp/ulams.log || true
          tail -200 api/storage/logs/*.log || true
          docker compose -f .github/conformance/compose.yml --profile lti logs moodle | tail -200

  # Single sign-on against Keycloak (docs/plans/phase-6-identity.md 4.14). The same workflow runs on pull requests
  # labelled "identity"; it carries its own services and steps.
  sso:
    name: Single sign-on with Keycloak
    if: >-
      (github.event_name == 'schedule' && vars.NIGHTLY_CONFORMANCE == 'true') ||
      (github.event_name == 'workflow_dispatch' && inputs.sso)
    uses: ./.github/workflows/identity-keycloak.yml

  saltire:
    # saLTIre (https://saltire.lti.app) is a hosted LTI test platform with no API: a person
    # configures it in the browser. Operator steps:
    #   1. On saLTIre's Platform page note the issuer, client ID, deployment ID and the
    #      authentication, access token and public keyset URLs; run this workflow with them as
    #      `saltire_platform`.
    #   2. The job opens a Cloudflare quick tunnel to a throwaway ulams and writes the tool URLs to
    #      the run summary; enter them in saLTIre's tool settings and launch.
    #   3. The job waits up to 30 minutes for a successful launch in ulams' audit log
    #      (lti_launches) and fails if none arrives or a launch was rejected.
    name: LTI 1.3 with saLTIre (operator)
    if: github.event_name == 'workflow_dispatch' && inputs.saltire
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:17.11-alpine
        env:
          POSTGRES_DB: default
          POSTGRES_USER: default
          POSTGRES_PASSWORD: secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U default -d default"
          --health-interval 5s --health-timeout 5s --health-retries 20
          --restart always
      valkey:
        image: valkey/valkey:8-alpine
        ports:
          - 6379:6379
        options: --restart always
    env:
      QUEUE_CONNECTION: sync
      SALTIRE_PLATFORM: ${{ inputs.saltire_platform }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Check the saLTIre platform input
        run: |
          printf '%s' "$SALTIRE_PLATFORM" | node -e "const p=JSON.parse(require('fs').readFileSync(0,'utf8'));for(const k of ['issuer','client_id','deployment_id','auth_login_url','auth_token_url','jwks_url'])if(!p[k])throw new Error('saltire_platform: missing '+k)"

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: apcu, bcmath, exif, gd, intl, pcntl, pdo_pgsql, redis, zip
          coverage: none
          tools: composer:v2

      - name: Tunnel (Cloudflare quick tunnel, no account)
        run: |
          curl -fsSL -o /tmp/cloudflared https://github.com/cloudflare/cloudflared/releases/download/2025.8.1/cloudflared-linux-amd64
          chmod +x /tmp/cloudflared
          nohup /tmp/cloudflared tunnel --no-autoupdate --url http://127.0.0.1:18000 > /tmp/tunnel.log 2>&1 &
          url=""
          for i in $(seq 1 60); do
            url=$(grep -o 'https://[a-z0-9-]*\.trycloudflare\.com' /tmp/tunnel.log | head -1 || true)
            [ -n "$url" ] && break
            sleep 2
          done
          [ -n "$url" ] || { cat /tmp/tunnel.log; exit 1; }
          echo "APP_URL=$url" >> "$GITHUB_ENV"
          echo "TENANCY_PLATFORM_HOSTS=${url#https://},127.0.0.1" >> "$GITHUB_ENV"

      - name: Prepare and start the API
        working-directory: api
        run: |
          cp docker/envs/.env.ci.postgres .env
          for i in $(seq 1 30); do
            if php -r 'try { new PDO("pgsql:host=" . getenv("DB_HOST") . ";port=" . getenv("DB_PORT") . ";dbname=" . getenv("DB_DATABASE"), getenv("DB_USERNAME"), getenv("DB_PASSWORD")); } catch (Throwable $e) { fwrite(STDERR, $e->getMessage() . "\n"); exit(1); }'; then
              break
            fi
            if [ "$i" -eq 30 ]; then
              echo "PostgreSQL at ${DB_HOST}:${DB_PORT} did not accept a connection after 30 attempts." >&2
              exit 1
            fi
            sleep 2
          done
          composer install --no-interaction --no-progress --prefer-dist
          php artisan migrate:fresh --force
          php artisan db:seed --force --class="Database\Seeders\PermissionsSeeder"
          php artisan passport:keys --force
          php artisan passport:client --personal --no-interaction
          php ../.github/conformance/lti/ulams-setup.php seed | tee /tmp/seed.json
          php ../.github/conformance/lti/ulams-setup.php platform "$SALTIRE_PLATFORM"
          PHP_CLI_SERVER_WORKERS=6 nohup php -S 0.0.0.0:18000 -t public \
            vendor/laravel/framework/src/Illuminate/Foundation/resources/server.php > /tmp/ulams.log 2>&1 &

      - name: Wait for launches from saLTIre
        working-directory: api
        run: |
          course=$(node -e "console.log(require('/tmp/seed.json').course_id)")
          {
            echo "## Enter these tool settings in saLTIre, then launch"
            echo ""
            echo "| saLTIre field | value |"
            echo "|---|---|"
            echo "| Initiate login URL | $APP_URL/api/lti/tool/login |"
            echo "| Redirection URI(s) / launch URL | $APP_URL/api/lti/tool/launch |"
            echo "| Public keyset URL | $APP_URL/api/lti/jwks |"
            echo "| Custom parameter | course_id=$course |"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "Tool URLs are in the run summary. Waiting up to 30 minutes for a launch."
          for i in $(seq 1 180); do
            php ../.github/conformance/lti/ulams-setup.php launches > /tmp/launches.json
            ok=$(node -e "console.log(require('/tmp/launches.json').ok)")
            failed=$(node -e "console.log(require('/tmp/launches.json').failed.length)")
            if [ "$failed" -gt 0 ]; then
              cat /tmp/launches.json
              exit 1
            fi
            if [ "$ok" -gt 0 ]; then
              echo "saLTIre launched ulams ($ok launch(es))"
              exit 0
            fi
            sleep 10
          done
          echo "No launch from saLTIre within 30 minutes"
          exit 1

      - name: Logs
        if: failure()
        run: tail -200 /tmp/ulams.log || true

  # P8-1 (docs/plans/phase-8-self-hosting.md 4.1): seed a PostgreSQL 12 cluster with the platform
  # database and two tenant databases (with the H5P schema), move it to 17 with
  # deploy/scripts/pg-major-upgrade.sh (which runs pg-verify.sh), run the tenant isolation suite on the
  # result and, once a week (Sunday UTC) and on manual runs, the logical-replication path.
  pg-upgrade:
    name: PostgreSQL 12 to 17 upgrade
    if: >-
      (github.event_name == 'schedule' && vars.NIGHTLY_CONFORMANCE == 'true') ||
      (github.event_name == 'workflow_dispatch' && inputs.pg_upgrade)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      # source version of the upgrade; the target is the default of pg-major-upgrade.sh
      PG_OLD_IMAGE: postgres:12
      POSTGRES_USER: default
      POSTGRES_PASSWORD: secret
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/docker-hub-mirror
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          token: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Working directory for the data
        run: echo "PG_WORK=$RUNNER_TEMP/pg-upgrade" >> "$GITHUB_ENV"

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: apcu, bcmath, exif, gd, intl, pcntl, pdo_pgsql, redis, zip
          ini-values: memory_limit=2G
          coverage: none
          tools: composer:v2

      - name: Install Composer dependencies
        working-directory: api
        run: |
          cp docker/envs/.env.ci.postgres .env
          # No scripts: post-autoload-dump runs package:discover, which boots Laravel and reads the
          # database (translations), and PostgreSQL 12 only starts in the next step.
          composer install --no-interaction --no-progress --prefer-dist --no-scripts

      - name: Start PostgreSQL 12 on a data directory
        run: |
          mkdir -p "$PG_WORK"
          docker run -d --name pg12 -p 5432:5432 -v "$PG_WORK/pg12:/var/lib/postgresql/data" \
            -e POSTGRES_USER -e POSTGRES_PASSWORD -e POSTGRES_DB=default "$PG_OLD_IMAGE"
          for _ in $(seq 1 60); do docker exec pg12 pg_isready -U default -d default && break; sleep 2; done
          sleep 5
          docker exec pg12 pg_isready -U default -d default

      # The platform database gets the real migrations and the permission seed; each tenant database
      # (a role and a database per tenant, as the provisioner makes them) gets the same, plus the H5P
      # schema with content, a tsvector column with a GIN index and a table without a primary key.
      - name: Seed the platform and two tenants
        working-directory: api
        run: |
          php artisan migrate:fresh --force
          php artisan db:seed --force --class="Database\Seeders\PermissionsSeeder"
          psql_in() { docker exec -i -e PGPASSWORD=secret pg12 psql -U default -X -q -v ON_ERROR_STOP=1 "$@"; }
          psql_in -d default -v tenant=platform < ../.github/pg-upgrade/h5p-fixture.sql
          for t in alpha beta; do
            psql_in -d postgres -c "CREATE ROLE ulams_$t LOGIN PASSWORD 'tenant-secret-$t'" -c "CREATE DATABASE ulams_$t OWNER ulams_$t"
            DB_DATABASE="ulams_$t" DB_USERNAME="ulams_$t" DB_PASSWORD="tenant-secret-$t" php artisan migrate --force
            DB_DATABASE="ulams_$t" DB_USERNAME="ulams_$t" DB_PASSWORD="tenant-secret-$t" \
              php artisan db:seed --force --class="Database\Seeders\PermissionsSeeder"
            psql_in -d "ulams_$t" -v tenant="$t" < ../.github/pg-upgrade/h5p-fixture.sql
          done
          docker exec pg12 psql -U default -d default -Atc "SELECT datname FROM pg_database WHERE NOT datistemplate"

      - name: Stop PostgreSQL 12 cleanly
        run: docker stop -t 60 pg12

      - name: Upgrade (dump, restore, verify)
        run: |
          sh deploy/scripts/pg-major-upgrade.sh --old-data "$PG_WORK/pg12" --new-data "$PG_WORK/pg17" \
            --old-image "$PG_OLD_IMAGE" --dump-dir "$PG_WORK/dumps"

      - name: Start PostgreSQL 17 on the new data and check the application on it
        working-directory: api
        run: |
          docker rm pg12
          docker run -d --name pg17 -p 5432:5432 -v "$PG_WORK/pg17:/var/lib/postgresql/data" \
            -e POSTGRES_USER -e POSTGRES_PASSWORD postgres:17.11-alpine
          for _ in $(seq 1 60); do docker exec pg17 pg_isready -U default -d default && break; sleep 2; done
          docker exec pg17 psql -U default -d default -Atc 'SHOW server_version'
          # a tenant role logs in over the network (the container's own address, not the trusted
          # loopback) with the password it had on 12, which is stored as an MD5 hash
          docker exec -e PGPASSWORD=tenant-secret-alpha pg17 sh -c 'psql -h "$(hostname -i)" -U ulams_alpha -d ulams_alpha -Atc "SELECT count(*) FROM permissions"'
          php artisan migrate --force
          php artisan db:seed --force --class="Database\Seeders\PermissionsSeeder"

      # Last: the suite resets the platform database.
      - name: Tenant isolation suite on PostgreSQL 17
        working-directory: api
        run: |
          php artisan passport:keys --force
          php artisan passport:client --personal --no-interaction
          mkdir -p vendor/orchestra/testbench-core/laravel/storage
          cp storage/oauth-private.key storage/oauth-public.key vendor/orchestra/testbench-core/laravel/storage/
          php artisan migrate --force --path=packages/courses/tests/Database/Migrations
          ./vendor/bin/phpunit --testsuite tenancy

      - name: Weekly gate for the logical-replication path
        id: weekly
        run: |
          if [ "${{ github.event_name }}" = workflow_dispatch ] || [ "$(date -u +%u)" = 7 ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Logical replication from the same PostgreSQL 12 data
        if: steps.weekly.outputs.run == 'true'
        run: |
          docker rm -f pg17
          docker network create pgrepl
          docker run -d --name old12 --network pgrepl -v "$PG_WORK/pg12:/var/lib/postgresql/data" \
            -e POSTGRES_USER -e POSTGRES_PASSWORD "$PG_OLD_IMAGE" \
            -c wal_level=logical -c max_replication_slots=10 -c max_wal_senders=10
          docker run -d --name new17 --network pgrepl -e POSTGRES_USER -e POSTGRES_PASSWORD -e POSTGRES_DB=postgres \
            postgres:17.11-alpine -c max_logical_replication_workers=12 -c max_worker_processes=24
          for c in old12 new17; do
            for _ in $(seq 1 60); do docker exec "$c" pg_isready -U default -d postgres && break; sleep 2; done
          done
          sleep 8
          sh deploy/scripts/pg-logical-upgrade.sh start --old old12 --new new17
          for _ in $(seq 1 60); do sh deploy/scripts/pg-logical-upgrade.sh status --old old12 --new new17 && break; sleep 5; done
          # writes during the replication, picked up by the final catch-up
          docker exec -e PGPASSWORD=secret old12 psql -U default -d ulams_alpha -c "INSERT INTO fixture_events (name) VALUES ('during replication')" \
            -c "INSERT INTO h5p.contents (title, main_library, metadata, parameters) VALUES ('late', 'H5P.Accordion', '{}', '{}')"
          sh deploy/scripts/pg-logical-upgrade.sh finish --old old12 --new new17

      - name: Logs
        if: failure()
        run: |
          docker ps -a
          for c in pg12 pg17 old12 new17; do docker logs --tail 80 "$c" 2>&1 || true; done

  # TD-3 (docs/plans/tech-debt-and-quality-bar.md, ADR 0190): the opt-in two-tenant test brings up the
  # development compose stack (Caddy, the API, PostgreSQL, Valkey, MinIO), provisions two real tenants
  # with `ulams:tenant:create` (database, bucket, env file, Passport keys) and talks to them over HTTP
  # by Host header. It also covers the cross-tenant builder check of docs/plans/leftovers-0-2.md L2-04.
  # The in-process walk over every route (api/tests/Integrations/TenantIsolationCoverageTest.php) runs
  # on every pull request; this one needs the live stack, hence nightly.
  tenancy:
    name: Two real tenants over HTTP
    if: >-
      (github.event_name == 'schedule' && vars.NIGHTLY_CONFORMANCE == 'true') ||
      (github.event_name == 'workflow_dispatch' && inputs.tenancy)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/docker-hub-mirror
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          token: ${{ secrets.DOCKERHUB_TOKEN }}

      # api/ is bind-mounted into the container, which hides the image's own vendor/ (installed
      # without dev packages): install it here, with PHPUnit.
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: apcu, bcmath, exif, gd, intl, pcntl, pdo_pgsql, redis, zip
          ini-values: memory_limit=2G
          coverage: none
          tools: composer:v2

      - name: Install Composer dependencies
        # No scripts: package:discover boots Laravel against a database that only exists once the
        # stack below is up; the container discovers the packages itself when it starts. The
        # post-root-package-install script is what created .env, which the tenant provisioning tests
        # (artisan child processes with an empty environment) read: create it here.
        run: |
          [ -f .env ] || cp .env.example .env
          composer install --no-interaction --no-progress --prefer-dist --no-scripts

      - name: Start the stack
        run: |
          # minio runs as a non-root user: a bind-mounted data directory that docker creates (root,
          # 755) makes it exit at once, and the tenant provisioning then cannot resolve "minio"
          mkdir -p docker/minio_storage
          chmod 777 docker/minio_storage
          docker compose up -d --build api caddy postgres redis minio
          sleep 10
          docker compose ps --status running --services | grep -qx minio || { docker compose logs minio; exit 1; }

      - name: Wait for the API to finish its start-up (migrations, keys, permissions)
        run: docker compose exec -T api ./wait.sh

      - name: Tenant isolation over HTTP
        run: |
          # only the HTTP test: the other tests of the directory need the CI database on 127.0.0.1
          docker compose exec -T -e TENANCY_INTEGRATION=1 api \
            vendor/bin/phpunit packages/tenancy/tests/Integration/TenantIsolationTest.php

      - name: Logs
        if: failure()
        run: |
          docker compose ps
          docker compose logs --tail 200 api caddy minio

      - name: Tear down
        if: always()
        run: docker compose down -v
