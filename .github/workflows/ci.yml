name: CI

# One workflow for the whole monorepo. Path filters live in the `changes` job (not in `on.paths`),
# so skipped jobs still report a status and `ci-ok` can be the single required check.
# Nothing here publishes: no image pushes, no Pages deploys, no Sentry releases.

on:
  pull_request:
  push:
    branches:
      - main
      - "phase-*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # PHPUnit shards: one line per matrix shard, `<shard>=<testsuite>,<testsuite>,...`.
  # Every <testsuite> in api/phpunit.xml must appear exactly once (checked in each shard).
  # Grouped by package area and balanced on local run times (~100-130 s of tests per shard).
  PHPUNIT_SHARDS: |
    learning=courses,course-access,courses-import-export,scorm,cmi5,h5p,lrs,bookmarks_notes,video,uploads,lti,liascript,interactive,code-exercises,adapt,course-builder
    living=living-course,learner-insights,tutor,knowledge-export
    tasks-topics=tasks,topic-types,topic-type-layout,topic-type-project,categories,tags,stationary-events
    gift-reports=topic-type-gift,reports,dictionaries
    commerce=cart,commerce,entitlements,vouchers,payments,invoices,consultations,consultation-access,webinar,jitsi,assign-without-account
    platform=Integrations,auth,core,permissions,settings,tenancy,demo,translations,model-fields,csv-users,ai,webhooks
    content=compliance,templates,templates-email,templates-pdf,templates-sms,notifications,bulk-notifications,mailerlite,files,images,pages

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      js: ${{ steps.filter.outputs.js }}
      demo: ${{ steps.filter.outputs.demo }}
      deploy: ${{ steps.filter.outputs.deploy }}
      sdk: ${{ steps.filter.outputs.sdk }}
      php: ${{ steps.api.outputs.php == 'true' || steps.filter.outputs.ci == 'true' }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # New files over 2 MB bloat every clone (no Git LFS, owner decision #48): generate fixtures at test
      # time instead (api/packages/uploads/tests/ZipFixtures.php). Allow a file by listing it in
      # .github/large-files-allowed.txt with the reason in the PR.
      - name: No new files over 2 MB
        if: github.event_name == 'pull_request'
        run: |
          too_big=0
          while IFS= read -r f; do
            [ -f "$f" ] || continue
            kb=$(du -k "$f" | cut -f1)
            if [ "$kb" -gt 2048 ] && ! grep -qxF "$f" .github/large-files-allowed.txt 2>/dev/null; then
              echo "::error file=$f::$f is ${kb} KB; new files over 2 MB are not allowed (generate it in the test or list it in .github/large-files-allowed.txt)"
              too_big=1
            fi
          done < <(git diff --name-only --diff-filter=A "${{ github.event.pull_request.base.sha }}" HEAD)
          exit $too_big
      # The table in docs/decisions/README.md is generated from the ADR files (scripts/adr-index.mjs).
      - name: ADR index is up to date
        run: node scripts/adr-index.mjs --check
      # Hostnames come from configuration (ULAMS_DOCS_URL, the tenant host pattern): no new hard-coded
      # `ulams.app` host in source files. Legitimate ones are listed in scripts/hosts-allowed.txt.
      - name: No hard-coded ulams.app hosts
        run: node scripts/check-hosts.mjs
      # PostgreSQL has one tag in api/docker-compose.yml, every workflow, the CLI and the examples.
      - name: Pinned images agree
        run: node scripts/check-pinned-images.mjs
      - name: Every API package has a README.md
        run: |
          missing=0
          for d in api/packages/*/; do
            if [ ! -f "${d}README.md" ]; then echo "::error::${d} has no README.md"; missing=1; fi
          done
          exit $missing
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            js:
              - "admin/**"
              - "front/**"
              - "demo-content/**"
              - "api/h5p/**"
              - "api/pdf/**"
              - "package.json"
              - "yarn.lock"
              - "turbo.json"
              - ".nvmrc"
              - ".github/**"
            demo:
              - "demo-content/**"
              - "front/interactive-bridge/**"
              - "package.json"
              - "yarn.lock"
              - ".github/**"
            ci:
              - ".github/**"
            sdk:
              - "sdk-php/**"
              - "front/cli/spec/openapi.json"
              - ".github/**"
            deploy:
              - "deploy/**"
              - "front/docs-site/examples/**"
              - ".github/**"
      # Separate call: `every` is needed for the exclusions and applies to the whole call.
      - uses: dorny/paths-filter@v4
        id: api
        with:
          predicate-quantifier: every
          filters: |
            php:
              - "api/**"
              - "!api/h5p/**"
              - "!api/pdf/**"

  js:
    name: JS (admin, front, web, ui, sdk, api-h5p, api-pdf)
    needs: changes
    if: needs.changes.outputs.js == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HUSKY: "0"
      COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
      TURBO_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: yarn

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: corepack yarn install --frozen-lockfile

      # Fails on any GPL-licensed or styled-components import in front/ and the shared
      # component library (front/src/lib, also compiled into admin). Runs before the slow tasks.
      - name: Licence guard
        run: |
          corepack yarn workspace front lint:gpl
          corepack yarn workspace front lint:styled

      # admin's `lint` script runs prettier with --write, which never fails; check formatting here.
      - name: Prettier check (admin)
        working-directory: admin
        # Resolve prettier the way Node does from admin/, so a hoisted copy from another workspace can't win
        run: |
          PRETTIER=$(node -p "require.resolve('prettier/bin-prettier.js', { paths: [process.cwd()] })")
          node "$PRETTIER" --version
          node "$PRETTIER" --check "**/**.{js,jsx,tsx,ts,less,md,json}" --end-of-line auto

      - name: Restore Turborepo cache
        uses: actions/cache@v6
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-

      - name: Typecheck, lint, build, test
        run: >-
          corepack yarn turbo run typecheck lint build test
          --filter=admin --filter=front --filter=api-h5p --filter=api-pdf
          --concurrency=2

      # The reference frontend and its libraries: typecheck, lint and unit tests. Playwright e2e and
      # visual need the whole stack and stay out of CI; the axe suite has its own job (web-a11y).
      # @ulams/code-runner: its test also fails when the runner files committed in api/packages/code-exercises are stale.
      - name: Typecheck, lint, test (web, ui, sdk, interactive-bridge, code-runner)
        run: >-
          corepack yarn turbo run typecheck lint test
          --filter=@ulams/web --filter=@ulams/ui --filter=@ulams/sdk --filter=@ulams/interactive-bridge --filter=@ulams/code-runner
          --concurrency=2

      # Interactive content packages (ADR 0088): the boundary lint, manifests, unit tests and the gravity build.
      - name: Typecheck, lint, build, test (demo-content)
        run: >-
          corepack yarn turbo run typecheck lint build test
          --filter=@ulams/demo-content --filter=@ulams/demo-gravity --concurrency=2

      # The ulams CLI and MCP server (front/cli): typecheck, lint, build and unit tests.
      - name: Typecheck, lint, build, test (ulams CLI)
        run: corepack yarn turbo run typecheck lint build test --filter=ulams --concurrency=2

      # create-ulams (front/create-ulams): unit tests, the packed file list and a dry run through the CLI built above.
      - name: Test (create-ulams)
        run: corepack yarn workspace create-ulams test

      # Every operation of the API's OpenAPI snapshot has a CLI command or a reasoned exclusion.
      - name: CLI endpoint coverage
        run: corepack yarn workspace ulams coverage

      # Phase 7.3: every operation has a readable unique operationId and a typed 2xx response (or a reasoned exception).
      - name: OpenAPI quality (operationIds, typed responses)
        run: corepack yarn workspace ulams spec-quality

  # The learner pages of the reference frontend against a mock tenant API (no PHP, Postgres or Docker):
  # axe (WCAG 2.2 AA) light and dark at desktop and 360 px, keyboard focus and reduced motion.
  web-a11y:
    name: Web accessibility (axe, keyboard)
    needs: changes
    if: needs.changes.outputs.js == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HUSKY: "0"
      COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: yarn
      - run: corepack enable
      - run: corepack yarn install --frozen-lockfile
      - name: Install Chromium
        run: corepack yarn playwright install --with-deps chromium
      - name: Build the reference frontend
        run: corepack yarn workspace @ulams/web build
      - name: Axe and keyboard checks
        run: corepack yarn workspace @ulams/web test:a11y
      - name: Playwright report
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: web-a11y-playwright
          path: front/web/test-results
          retention-days: 7

  # The admin in a real browser without a backend: the built admin is served statically and every API call is
  # answered by a deterministic in-browser mock (admin/src/e2e/mocked/mockApi.ts). Covers the pdfme certificate
  # designer (open, edit, preview, save, reopen), the legacy ReportBro banner, the e-mail template editor (axe in
  # code, visual, preview and image dialog, the keyboard-only path, reduced motion, locales, no request leaves the
  # origin) and axe (WCAG 2.2 AA).
  # The other admin specs in src/e2e need a live API and stay out of CI.
  admin-a11y:
    name: Admin browser tests (Playwright, axe)
    needs: changes
    if: needs.changes.outputs.js == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      HUSKY: "0"
      COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: yarn
      - run: corepack enable
      - run: corepack yarn install --frozen-lockfile
      - name: Install Chromium
        run: corepack yarn playwright install --with-deps chromium
      - name: Build the admin
        working-directory: admin
        env:
          REACT_APP_API_URL: http://api.mock
        run: corepack yarn build
      - name: Playwright (mocked API)
        working-directory: admin
        run: corepack yarn playwright:mock
      - name: Playwright report
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: admin-a11y-playwright
          path: admin/test-results
          retention-days: 7

  # The interactive content packages (demo-content) in a real browser, on throwaway servers: each package
  # loads in the opaque sandbox, steps advance, no request leaves the origin, keyboard, WebGL fallback, axe.
  demo-content:
    name: Demo content packages (Playwright)
    needs: changes
    if: needs.changes.outputs.demo == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      HUSKY: "0"
      COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: yarn
      - run: corepack enable
      - run: corepack yarn install --frozen-lockfile
      - name: Install Chromium
        run: corepack yarn playwright install --with-deps chromium
      - name: Package tests
        run: corepack yarn workspace @ulams/demo-content test:e2e
      - name: Playwright report
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: demo-content-playwright
          path: demo-content/test-results
          retention-days: 7

  php:
    name: PHPUnit (${{ matrix.shard }})
    needs: changes
    if: needs.changes.outputs.php == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [learning, living, tasks-topics, gift-reports, commerce, platform, content]
    defaults:
      run:
        working-directory: api
    services:
      # Same tag as api/docker-compose.yml and the other workflows: scripts/check-pinned-images.mjs fails when they differ.
      postgres:
        image: postgres:17.11-alpine
        env:
          # Matches the <env> defaults in api/phpunit.xml (DB default/default/secret on 127.0.0.1).
          POSTGRES_DB: default
          POSTGRES_USER: default
          POSTGRES_PASSWORD: secret
          TZ: Europe/Warsaw
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U default -d default"
          --health-interval 5s --health-timeout 5s --health-retries 20
      valkey:
        image: valkey/valkey:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      # Real environment variables win over .env (Laravel) and over non-forced <env> in phpunit.xml.
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: "5432"
      DB_DATABASE: default
      DB_USERNAME: default
      DB_PASSWORD: secret
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ""
      XDEBUG_MODE: "off"
    steps:
      - uses: actions/checkout@v7

      - name: Resolve shard suites
        id: shard
        run: |
          suites=$(printf '%s\n' "$PHPUNIT_SHARDS" | sed -n "s/^${{ matrix.shard }}=//p")
          if [ -z "$suites" ]; then
            echo "::error::Shard '${{ matrix.shard }}' is not defined in PHPUNIT_SHARDS"
            exit 1
          fi
          echo "suites=$suites" >> "$GITHUB_OUTPUT"

      - name: Check every testsuite is in exactly one shard
        run: |
          grep -o '<testsuite name="[^"]*"' phpunit.xml | sed 's/.*name="//;s/"$//' | sort > /tmp/declared
          printf '%s\n' "$PHPUNIT_SHARDS" | sed -n 's/^[^=]*=//p' | tr ',' '\n' | sed '/^$/d' | sort > /tmp/sharded
          if ! diff -u /tmp/declared /tmp/sharded; then
            echo "::error::PHPUNIT_SHARDS in .github/workflows/ci.yml does not match the testsuites in api/phpunit.xml (- missing from shards, + unknown or duplicated)"
            exit 1
          fi

      # ffprobe reads the length of audio/video topics (topic-types, php-ffmpeg) and ffmpeg
      # transcodes in packages/video; both are in our PHP image (api/docker/php/install.sh).
      - name: Install ffmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends ffmpeg
          ffprobe -version | head -1

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          # Same set as api/docker/php/install.sh (pdo_mysql left out: CI is Postgres-only).
          extensions: apcu, bcmath, exif, gd, intl, pcntl, pdo_pgsql, redis, zip
          ini-values: memory_limit=2G
          coverage: none
          tools: composer:v2

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v6
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-${{ hashFiles('api/composer.lock') }}
          restore-keys: |
            composer-${{ runner.os }}-

      - name: Copy CI environment
        run: cp docker/envs/.env.ci.postgres .env

      # From the lock: Composer 2.10's advisory blocking only applies to update/require.
      - name: Install Composer dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Prepare database and Passport
        run: |
          php artisan migrate:fresh --force
          php artisan db:seed --force --class="Database\Seeders\PermissionsSeeder"
          php artisan passport:keys --force
          php artisan passport:client --personal --no-interaction
          mkdir -p vendor/orchestra/testbench-core/laravel/storage
          cp storage/oauth-private.key storage/oauth-public.key vendor/orchestra/testbench-core/laravel/storage/
          php artisan migrate --force --path=packages/courses/tests/Database/Migrations

      # Replaces the old swagger.yml build (without its GitHub Pages deploy): catches annotation errors.
      - name: OpenAPI generation
        if: matrix.shard == 'platform'
        run: php artisan l5-swagger:generate

      # The ulams CLI commits the normalised spec (front/cli/spec/openapi.json) and the operation list it
      # derives; fail when the annotations moved on without them. The failure message lists the refresh commands.
      - name: CLI spec is current
        if: matrix.shard == 'platform'
        run: node ../front/cli/scripts/sync-spec.mjs storage/api-docs/api-docs.json --check

      # api/phpunit.quarantine.xml lists tests that are known to fail, each with a reason and an issue.
      # They are excluded from the blocking run and re-run non-blocking below. Keep the file empty.
      - name: Load quarantine
        run: |
          names=$(grep -o '<test name="[^"]*"' phpunit.quarantine.xml | sed 's/.*name="//;s/"$//;s/$/\\b/' | paste -sd'|' -)
          echo "PHPUNIT_QUARANTINE=${names}" >> "$GITHUB_ENV"
          echo "Quarantined: ${names:-none}"

      - name: PHPUnit
        run: |
          filter=()
          if [ -n "${PHPUNIT_QUARANTINE}" ]; then filter=(--filter "/^(?!.*(?:${PHPUNIT_QUARANTINE}))/"); fi
          ./vendor/bin/phpunit \
            --testsuite "${{ steps.shard.outputs.suites }}" \
            "${filter[@]}" \
            --log-junit "junit-${{ matrix.shard }}.xml"

      # PHPUnit exits 1 on "No tests executed!": skip shards without quarantined tests.
      - name: Quarantined tests (non-blocking)
        if: success() || failure()
        continue-on-error: true
        run: |
          if [ -z "${PHPUNIT_QUARANTINE}" ]; then
            echo "Nothing is quarantined."
            exit 0
          fi
          if ! ./vendor/bin/phpunit --testsuite "${{ steps.shard.outputs.suites }}" \
              --filter "/(?:${PHPUNIT_QUARANTINE})/" --list-tests | grep -q '^ - '; then
            echo "No quarantined tests in this shard."
            exit 0
          fi
          ./vendor/bin/phpunit \
            --testsuite "${{ steps.shard.outputs.suites }}" \
            --filter "/(?:${PHPUNIT_QUARANTINE})/"

      - name: Upload JUnit report
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: phpunit-${{ matrix.shard }}
          path: |
            api/junit-${{ matrix.shard }}.xml
            api/storage/logs/
          if-no-files-found: ignore
          retention-days: 7

  # Production, the MyDevil staging and the local demo stack install vendor without dev packages. Faker
  # providers, model factories and testbench are missing there, so a runtime dependency on them passes
  # PHPUnit and breaks in production. This job installs with --no-dev, boots the app and drives a Course
  # Builder apply on the fake AI driver (api/scripts/nodev-smoke.php).
  php-no-dev:
    name: API boot and Course Builder apply (composer install --no-dev)
    needs: changes
    if: needs.changes.outputs.php == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: api
    services:
      postgres:
        image: postgres:17.11-alpine
        env:
          POSTGRES_DB: default
          POSTGRES_USER: default
          POSTGRES_PASSWORD: secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U default -d default"
          --health-interval 5s --health-timeout 5s --health-retries 20
      valkey:
        image: valkey/valkey:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: "5432"
      DB_DATABASE: default
      DB_USERNAME: default
      DB_PASSWORD: secret
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ""
      AI_DRIVER: fake
      QUEUE_CONNECTION: sync
      CACHE_DRIVER: array
      SESSION_DRIVER: array
    steps:
      - uses: actions/checkout@v7

      - name: Runtime code has no factories or dev-only packages
        run: php scripts/check-runtime-deps.php

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: apcu, bcmath, exif, gd, intl, pcntl, pdo_pgsql, redis, zip
          ini-values: memory_limit=2G
          coverage: none
          tools: composer:v2

      - name: Copy CI environment
        run: cp docker/envs/.env.ci.postgres .env

      # Needs the database: package:discover boots the providers.
      - name: Install Composer dependencies without dev packages
        run: composer install --no-dev --no-interaction --no-progress --prefer-dist --optimize-autoloader

      - name: Dev packages are absent
        run: test ! -d vendor/davidbadura && test ! -d vendor/phpunit

      - name: Prepare database and Passport
        run: |
          php artisan migrate --force
          php artisan db:seed --force --class="Database\Seeders\PermissionsSeeder"
          php artisan db:seed --force --class="Ulams\CourseBuilder\Database\Seeders\CourseBuilderPermissionSeeder"
          php artisan passport:keys --force
          php artisan passport:client --personal --no-interaction

      - name: php artisan about
        run: php artisan about

      - name: Course Builder apply on the fake driver, failed job recording
        run: php scripts/nodev-smoke.php

  # Vulnerabilities in the lockfiles (composer.lock, yarn.lock) and misconfiguration in Dockerfiles, Compose
  # and Kubernetes files, with Trivy from one pinned image (.github/scripts/trivy.sh). Only findings with a
  # fix available count, and only CRITICAL and HIGH fail the job (patch policy in SECURITY.md). Accepted
  # exceptions are in .trivyignore.yaml, each with a reason and an expiry that scripts/check-trivyignore.mjs
  # enforces. The SARIF report goes to code scanning when that is enabled for the repository.
  security-scan:
    name: Security scan (Trivy)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7
      - name: Exceptions are complete and not expired
        run: |
          node --test scripts/check-trivyignore.test.mjs
          node scripts/check-trivyignore.mjs
      - name: Shellcheck of the supply-chain scripts
        run: docker run --rm -v "$PWD/.github/scripts:/mnt" koalaman/shellcheck:stable -e SC1091 /mnt/trivy.sh /mnt/supply-chain.sh /mnt/release-assets.sh /mnt/test-supply-chain.sh
      - name: Trivy database cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/trivy-ulams
          key: trivy-db-${{ github.run_id }}
          restore-keys: trivy-db-
      - name: Report for code scanning
        run: FORMAT=sarif OUTPUT=trivy-fs.sarif EXIT_CODE=0 sh .github/scripts/trivy.sh fs
      # Needs code scanning enabled in the repository settings and a token that may write it (not on forks or
      # Dependabot pull requests): never a reason to fail the build.
      - name: Upload to code scanning
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: trivy-fs.sarif
          category: trivy-fs
      - name: Fixable critical and high findings
        run: sh .github/scripts/trivy.sh fs

  # The API image carries the PHP ini and php-fpm pool files (api/docker). Upload progress must stay off in
  # it (CVE-2026-109619, php.net advisory 2026-10-21-5): read the setting back from the built image through
  # php-cli ini scanning and through the php-fpm pool config. No PHP version gate here yet.
  php-image:
    name: PHP image settings
    needs: changes
    if: needs.changes.outputs.php == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/docker-hub-mirror
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          token: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build
        run: docker build -t smoke-api api
      - name: Trivy database cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/trivy-ulams
          key: trivy-db-${{ github.run_id }}
          restore-keys: trivy-db-
      # Fixable CRITICAL findings in the image fail the job (patch policy: SECURITY.md); HIGH ones are reported
      # by the nightly scan. Accepted exceptions live in .trivyignore.yaml.
      - name: Trivy (fixable critical)
        run: IMAGE_SRC=docker sh .github/scripts/trivy.sh image smoke-api
      - name: Upload progress is off
        run: |
          docker run --rm smoke-api php -v | head -1
          test "$(docker run --rm smoke-api php -r 'echo ini_get("session.upload_progress.enabled");')" = "0"
          docker run --rm smoke-api php-fpm -tt 2>&1 | grep -F 'php_admin_value[session.upload_progress.enabled] = 0'
          docker run --rm smoke-api php-fpm -t
      # The written GPL source offer (api/docker/php/NOTICE) names this package list.
      - name: Alpine package list for the GPL source offer
        run: |
          docker run --rm smoke-api sh -c 'test -s /usr/share/doc/ulams/apk-packages.txt && grep -E "^ffmpeg-[0-9]" /usr/share/doc/ulams/apk-packages.txt'
          docker run --rm smoke-api grep -F 'apk-packages.txt' /usr/local/share/doc/ulams-php/NOTICE

  # The static images (admin, legacy front) run as non-root on nginx-unprivileged (ADR 0056):
  # build them, start them with settings in the environment and check what they serve.
  images:
    name: Image smoke (${{ matrix.name }})
    needs: changes
    if: needs.changes.outputs.js == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: admin
            prefix: REACT_APP_
          - name: front
            prefix: VITE_APP_
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/docker-hub-mirror
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          token: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build
        run: docker build -f ${{ matrix.name }}/Dockerfile -t smoke-${{ matrix.name }} .
      - name: Trivy database cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/trivy-ulams
          key: trivy-db-${{ github.run_id }}
          restore-keys: trivy-db-
      - name: Trivy (fixable critical)
        run: IMAGE_SRC=docker sh .github/scripts/trivy.sh image smoke-${{ matrix.name }}
      - name: Start, request and check
        run: |
          docker run -d --name smoke -p 8080:8080 -e ${{ matrix.prefix }}API_URL=https://api.example.com -e ${{ matrix.prefix }}NOT_ALLOWED=1 -e SECRET_TOKEN=must-not-leak smoke-${{ matrix.name }}
          for i in $(seq 1 30); do curl -sf http://localhost:8080/healthz && break; sleep 1; done
          test "$(docker exec smoke id -u)" != "0"
          curl -sf http://localhost:8080/ | grep -q '<div id="root"'
          curl -sf http://localhost:8080/some/spa/route | grep -q '<div id="root"'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/missing.js)" = 404
          config=$(curl -sf http://localhost:8080/runtime-config.json)
          echo "$config"
          echo "$config" | grep -q '"${{ matrix.prefix }}API_URL":"https://api.example.com"'
          if echo "$config" | grep -q 'must-not-leak'; then echo "::error::runtime-config.json leaks a variable outside ${{ matrix.prefix }}*"; exit 1; fi
          size=$(docker image inspect smoke-${{ matrix.name }} --format '{{.Size}}')
          echo "image size: $((size / 1000000)) MB"
      - name: Logs on failure
        if: failure()
        run: docker logs smoke || true

  # Offline checks of the production install files (deploy/vps-cloudflare): docker compose config in
  # every mode, Caddy in both host layouts and both origin modes, cloudflared ingress and shellcheck.
  deploy:
    name: Deploy files
    needs: changes
    if: needs.changes.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/docker-hub-mirror
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          token: ${{ secrets.DOCKERHUB_TOKEN }}
      # `docker run` falls back to docker.io when the daemon mirror is skipped; pull through the
      # mirror explicitly and retag, so validate.sh finds the images locally.
      - name: Pre-pull the validation images through the mirror
        run: |
          images=$(grep -oE '(caddy:[0-9.]+-alpine|cloudflare/cloudflared:[0-9.]+)' deploy/vps-cloudflare/compose.yml | sort -u)
          for img in $images koalaman/shellcheck:stable; do
            case "$img" in */*) src="mirror.gcr.io/$img" ;; *) src="mirror.gcr.io/library/$img" ;; esac
            docker pull "$src" && docker tag "$src" "$img"
          done
      - run: deploy/vps-cloudflare/scripts/validate.sh
      - name: MyDevil PHP version check
        run: |
          sh deploy/mydevil/test/check-host-version.sh
          docker run --rm -v "$PWD/deploy/mydevil:/mnt" koalaman/shellcheck:stable -e SC3045,SC2016 bin/check-host.sh test/check-host-version.sh

  # The PHP client in sdk-php/ is generated from front/cli/spec/openapi.json (openapi-generator, pinned image):
  # regenerate and fail on any difference, then run its tests against canned answers.
  php-sdk:
    name: PHP SDK (generated client)
    needs: changes
    if: needs.changes.outputs.sdk == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/docker-hub-mirror
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          token: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: curl, json, mbstring
          coverage: none
          tools: composer:v2
      - name: Regenerate the client and fail on any difference
        run: |
          sdk-php/generate.sh
          git add -N sdk-php
          if ! git diff --exit-code --stat -- sdk-php; then
            echo "::error::sdk-php is out of date with front/cli/spec/openapi.json: run sdk-php/generate.sh and commit the result"
            exit 1
          fi
      - run: composer install --working-dir=sdk-php --no-interaction --prefer-dist
      - run: sdk-php/vendor/bin/phpunit -c sdk-php/phpunit.xml

  ci-ok:
    name: CI OK
    needs: [changes, js, demo-content, php, php-no-dev, php-sdk, images, deploy, security-scan]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fail if any job failed or was cancelled
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: |
          echo "changes=${{ needs.changes.result }} js=${{ needs.js.result }} demo-content=${{ needs.demo-content.result }} php=${{ needs.php.result }} php-no-dev=${{ needs.php-no-dev.result }} php-sdk=${{ needs.php-sdk.result }} images=${{ needs.images.result }} deploy=${{ needs.deploy.result }} security-scan=${{ needs.security-scan.result }}"
          exit 1
      - run: echo "All required jobs passed or were skipped by the path filters."
