name: CI

# One workflow for the whole monorepo. Path filters live in the `changes` job (not in `on.paths`),
# so skipped jobs still report a status and `ci-ok` can be the single required check.
# Nothing here publishes: no image pushes, no Pages deploys, no Sentry releases.

on:
  pull_request:
  push:
    branches:
      - main
      - "phase-*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # PHPUnit shards: one line per matrix shard, `<shard>=<testsuite>,<testsuite>,...`.
  # Every <testsuite> in api/phpunit.xml must appear exactly once (checked in each shard).
  # Grouped by package area and balanced on local run times (~100-130 s of tests per shard).
  PHPUNIT_SHARDS: |
    learning=courses,course-access,courses-import-export,scorm,cmi5,h5p,lrs,bookmarks_notes,video,uploads,lti,liascript,interactive,adapt,course-builder
    living=living-course
    tasks-topics=tasks,topic-types,topic-type-layout,topic-type-project,categories,tags,stationary-events
    gift-reports=topic-type-gift,reports,dictionaries
    commerce=cart,commerce,vouchers,payments,invoices,consultations,consultation-access,webinar,jitsi,assign-without-account
    platform=Integrations,auth,core,permissions,settings,tenancy,demo,translations,model-fields,csv-users,ai
    content=templates,templates-email,templates-pdf,templates-sms,notifications,bulk-notifications,mailerlite,files,images,pages

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      js: ${{ steps.filter.outputs.js }}
      demo: ${{ steps.filter.outputs.demo }}
      deploy: ${{ steps.filter.outputs.deploy }}
      php: ${{ steps.api.outputs.php == 'true' || steps.filter.outputs.ci == 'true' }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # New files over 2 MB bloat every clone (no Git LFS, owner decision #48): generate fixtures at test
      # time instead (api/packages/uploads/tests/ZipFixtures.php). Allow a file by listing it in
      # .github/large-files-allowed.txt with the reason in the PR.
      - name: No new files over 2 MB
        if: github.event_name == 'pull_request'
        run: |
          too_big=0
          while IFS= read -r f; do
            [ -f "$f" ] || continue
            kb=$(du -k "$f" | cut -f1)
            if [ "$kb" -gt 2048 ] && ! grep -qxF "$f" .github/large-files-allowed.txt 2>/dev/null; then
              echo "::error file=$f::$f is ${kb} KB; new files over 2 MB are not allowed (generate it in the test or list it in .github/large-files-allowed.txt)"
              too_big=1
            fi
          done < <(git diff --name-only --diff-filter=A "${{ github.event.pull_request.base.sha }}" HEAD)
          exit $too_big
      # The table in docs/decisions/README.md is generated from the ADR files (scripts/adr-index.mjs).
      - name: ADR index is up to date
        run: node scripts/adr-index.mjs --check
      - name: Every API package has a README.md
        run: |
          missing=0
          for d in api/packages/*/; do
            if [ ! -f "${d}README.md" ]; then echo "::error::${d} has no README.md"; missing=1; fi
          done
          exit $missing
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            js:
              - "admin/**"
              - "front/**"
              - "demo-content/**"
              - "api/h5p/**"
              - "api/pdf/**"
              - "package.json"
              - "yarn.lock"
              - "turbo.json"
              - ".nvmrc"
              - ".github/**"
            demo:
              - "demo-content/**"
              - "front/interactive-bridge/**"
              - "package.json"
              - "yarn.lock"
              - ".github/**"
            ci:
              - ".github/**"
            deploy:
              - "deploy/**"
              - "front/docs-site/examples/**"
              - ".github/**"
      # Separate call: `every` is needed for the exclusions and applies to the whole call.
      - uses: dorny/paths-filter@v4
        id: api
        with:
          predicate-quantifier: every
          filters: |
            php:
              - "api/**"
              - "!api/h5p/**"
              - "!api/pdf/**"

  js:
    name: JS (admin, front, web, ui, sdk, api-h5p, api-pdf)
    needs: changes
    if: needs.changes.outputs.js == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HUSKY: "0"
      COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
      TURBO_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: yarn

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: corepack yarn install --frozen-lockfile

      # Fails on any GPL-licensed or styled-components import in front/ and the shared
      # component library (front/src/lib, also compiled into admin). Runs before the slow tasks.
      - name: Licence guard
        run: |
          corepack yarn workspace front lint:gpl
          corepack yarn workspace front lint:styled

      # admin's `lint` script runs prettier with --write, which never fails; check formatting here.
      - name: Prettier check (admin)
        working-directory: admin
        # Resolve prettier the way Node does from admin/, so a hoisted copy from another workspace can't win
        run: |
          PRETTIER=$(node -p "require.resolve('prettier/bin-prettier.js', { paths: [process.cwd()] })")
          node "$PRETTIER" --version
          node "$PRETTIER" --check "**/**.{js,jsx,tsx,ts,less,md,json}" --end-of-line auto

      - name: Restore Turborepo cache
        uses: actions/cache@v6
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-

      - name: Typecheck, lint, build, test
        run: >-
          corepack yarn turbo run typecheck lint build test
          --filter=admin --filter=front --filter=api-h5p --filter=api-pdf
          --concurrency=2

      # The reference frontend and its libraries: typecheck, lint and unit tests. Playwright (e2e,
      # visual, a11y) needs the whole stack and stays out of CI.
      - name: Typecheck, lint, test (web, ui, sdk, interactive-bridge)
        run: >-
          corepack yarn turbo run typecheck lint test
          --filter=@ulams/web --filter=@ulams/ui --filter=@ulams/sdk --filter=@ulams/interactive-bridge
          --concurrency=2

      # Interactive content packages (ADR 0088): the boundary lint, manifests, unit tests and the gravity build.
      - name: Typecheck, lint, build, test (demo-content)
        run: >-
          corepack yarn turbo run typecheck lint build test
          --filter=@ulams/demo-content --filter=@ulams/demo-gravity --concurrency=2

      # The ulams CLI and MCP server (front/cli): typecheck, lint, build and unit tests.
      - name: Typecheck, lint, build, test (ulams CLI)
        run: corepack yarn turbo run typecheck lint build test --filter=ulams --concurrency=2

      # Every operation of the API's OpenAPI snapshot has a CLI command or a reasoned exclusion.
      - name: CLI endpoint coverage
        run: corepack yarn workspace ulams coverage

  # The interactive content packages (demo-content) in a real browser, on throwaway servers: each package
  # loads in the opaque sandbox, steps advance, no request leaves the origin, keyboard, WebGL fallback, axe.
  demo-content:
    name: Demo content packages (Playwright)
    needs: changes
    if: needs.changes.outputs.demo == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      HUSKY: "0"
      COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: yarn
      - run: corepack enable
      - run: corepack yarn install --frozen-lockfile
      - name: Install Chromium
        run: corepack yarn playwright install --with-deps chromium
      - name: Package tests
        run: corepack yarn workspace @ulams/demo-content test:e2e
      - name: Playwright report
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: demo-content-playwright
          path: demo-content/test-results
          retention-days: 7

  php:
    name: PHPUnit (${{ matrix.shard }})
    needs: changes
    if: needs.changes.outputs.php == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [learning, living, tasks-topics, gift-reports, commerce, platform, content]
    defaults:
      run:
        working-directory: api
    services:
      # Same major as api/docker-compose.yml; move together when Postgres is upgraded.
      postgres:
        image: postgres:12
        env:
          # Matches the <env> defaults in api/phpunit.xml (DB default/default/secret on 127.0.0.1).
          POSTGRES_DB: default
          POSTGRES_USER: default
          POSTGRES_PASSWORD: secret
          TZ: Europe/Warsaw
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U default -d default"
          --health-interval 5s --health-timeout 5s --health-retries 20
      valkey:
        image: valkey/valkey:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      # Real environment variables win over .env (Laravel) and over non-forced <env> in phpunit.xml.
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: "5432"
      DB_DATABASE: default
      DB_USERNAME: default
      DB_PASSWORD: secret
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ""
      XDEBUG_MODE: "off"
    steps:
      - uses: actions/checkout@v7

      - name: Resolve shard suites
        id: shard
        run: |
          suites=$(printf '%s\n' "$PHPUNIT_SHARDS" | sed -n "s/^${{ matrix.shard }}=//p")
          if [ -z "$suites" ]; then
            echo "::error::Shard '${{ matrix.shard }}' is not defined in PHPUNIT_SHARDS"
            exit 1
          fi
          echo "suites=$suites" >> "$GITHUB_OUTPUT"

      - name: Check every testsuite is in exactly one shard
        run: |
          grep -o '<testsuite name="[^"]*"' phpunit.xml | sed 's/.*name="//;s/"$//' | sort > /tmp/declared
          printf '%s\n' "$PHPUNIT_SHARDS" | sed -n 's/^[^=]*=//p' | tr ',' '\n' | sed '/^$/d' | sort > /tmp/sharded
          if ! diff -u /tmp/declared /tmp/sharded; then
            echo "::error::PHPUNIT_SHARDS in .github/workflows/ci.yml does not match the testsuites in api/phpunit.xml (- missing from shards, + unknown or duplicated)"
            exit 1
          fi

      # ffprobe reads the length of audio/video topics (topic-types, php-ffmpeg) and ffmpeg
      # transcodes in packages/video; both are in our PHP image (api/docker/php/install.sh).
      - name: Install ffmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends ffmpeg
          ffprobe -version | head -1

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          # Same set as api/docker/php/install.sh (pdo_mysql left out: CI is Postgres-only).
          extensions: apcu, bcmath, exif, gd, intl, pcntl, pdo_pgsql, redis, zip
          ini-values: memory_limit=2G
          coverage: none
          tools: composer:v2

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v6
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-${{ hashFiles('api/composer.lock') }}
          restore-keys: |
            composer-${{ runner.os }}-

      - name: Copy CI environment
        run: cp docker/envs/.env.ci.postgres .env

      # From the lock: Composer 2.10's advisory blocking only applies to update/require.
      - name: Install Composer dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Prepare database and Passport
        run: |
          php artisan migrate:fresh --force
          php artisan db:seed --force --class="Database\Seeders\PermissionsSeeder"
          php artisan passport:keys --force
          php artisan passport:client --personal --no-interaction
          mkdir -p vendor/orchestra/testbench-core/laravel/storage
          cp storage/oauth-private.key storage/oauth-public.key vendor/orchestra/testbench-core/laravel/storage/
          php artisan migrate --force --path=packages/courses/tests/Database/Migrations

      # Replaces the old swagger.yml build (without its GitHub Pages deploy): catches annotation errors.
      - name: OpenAPI generation
        if: matrix.shard == 'platform'
        run: php artisan l5-swagger:generate

      # The ulams CLI commits the normalised spec (front/cli/spec/openapi.json) and the operation list it
      # derives; fail when the annotations moved on without them. The failure message lists the refresh commands.
      - name: CLI spec is current
        if: matrix.shard == 'platform'
        run: node ../front/cli/scripts/sync-spec.mjs storage/api-docs/api-docs.json --check

      # api/phpunit.quarantine.xml lists tests that are known to fail, each with a reason and an issue.
      # They are excluded from the blocking run and re-run non-blocking below. Keep the file empty.
      - name: Load quarantine
        run: |
          names=$(grep -o '<test name="[^"]*"' phpunit.quarantine.xml | sed 's/.*name="//;s/"$//;s/$/\\b/' | paste -sd'|' -)
          echo "PHPUNIT_QUARANTINE=${names}" >> "$GITHUB_ENV"
          echo "Quarantined: ${names:-none}"

      - name: PHPUnit
        run: |
          filter=()
          if [ -n "${PHPUNIT_QUARANTINE}" ]; then filter=(--filter "/^(?!.*(?:${PHPUNIT_QUARANTINE}))/"); fi
          ./vendor/bin/phpunit \
            --testsuite "${{ steps.shard.outputs.suites }}" \
            "${filter[@]}" \
            --log-junit "junit-${{ matrix.shard }}.xml"

      # PHPUnit exits 1 on "No tests executed!": skip shards without quarantined tests.
      - name: Quarantined tests (non-blocking)
        if: success() || failure()
        continue-on-error: true
        run: |
          if [ -z "${PHPUNIT_QUARANTINE}" ]; then
            echo "Nothing is quarantined."
            exit 0
          fi
          if ! ./vendor/bin/phpunit --testsuite "${{ steps.shard.outputs.suites }}" \
              --filter "/(?:${PHPUNIT_QUARANTINE})/" --list-tests | grep -q '^ - '; then
            echo "No quarantined tests in this shard."
            exit 0
          fi
          ./vendor/bin/phpunit \
            --testsuite "${{ steps.shard.outputs.suites }}" \
            --filter "/(?:${PHPUNIT_QUARANTINE})/"

      - name: Upload JUnit report
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: phpunit-${{ matrix.shard }}
          path: |
            api/junit-${{ matrix.shard }}.xml
            api/storage/logs/
          if-no-files-found: ignore
          retention-days: 7

  # The static images (admin, legacy front) run as non-root on nginx-unprivileged (ADR 0056):
  # build them, start them with settings in the environment and check what they serve.
  images:
    name: Image smoke (${{ matrix.name }})
    needs: changes
    if: needs.changes.outputs.js == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: admin
            prefix: REACT_APP_
          - name: front
            prefix: VITE_APP_
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/docker-hub-mirror
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          token: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build
        run: docker build -f ${{ matrix.name }}/Dockerfile -t smoke-${{ matrix.name }} .
      - name: Start, request and check
        run: |
          docker run -d --name smoke -p 8080:8080 -e ${{ matrix.prefix }}API_URL=https://api.example.com -e ${{ matrix.prefix }}NOT_ALLOWED=1 -e SECRET_TOKEN=must-not-leak smoke-${{ matrix.name }}
          for i in $(seq 1 30); do curl -sf http://localhost:8080/healthz && break; sleep 1; done
          test "$(docker exec smoke id -u)" != "0"
          curl -sf http://localhost:8080/ | grep -q '<div id="root"'
          curl -sf http://localhost:8080/some/spa/route | grep -q '<div id="root"'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/missing.js)" = 404
          config=$(curl -sf http://localhost:8080/runtime-config.json)
          echo "$config"
          echo "$config" | grep -q '"${{ matrix.prefix }}API_URL":"https://api.example.com"'
          if echo "$config" | grep -q 'must-not-leak'; then echo "::error::runtime-config.json leaks a variable outside ${{ matrix.prefix }}*"; exit 1; fi
          size=$(docker image inspect smoke-${{ matrix.name }} --format '{{.Size}}')
          echo "image size: $((size / 1000000)) MB"
      - name: Logs on failure
        if: failure()
        run: docker logs smoke || true

  # Offline checks of the production install files (deploy/vps-cloudflare): docker compose config in
  # every mode, Caddy in both host layouts and both origin modes, cloudflared ingress and shellcheck.
  deploy:
    name: Deploy files
    needs: changes
    if: needs.changes.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/docker-hub-mirror
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          token: ${{ secrets.DOCKERHUB_TOKEN }}
      # `docker run` falls back to docker.io when the daemon mirror is skipped; pull through the
      # mirror explicitly and retag, so validate.sh finds the images locally.
      - name: Pre-pull the validation images through the mirror
        run: |
          images=$(grep -oE '(caddy:[0-9.]+-alpine|cloudflare/cloudflared:[0-9.]+)' deploy/vps-cloudflare/compose.yml | sort -u)
          for img in $images koalaman/shellcheck:stable; do
            case "$img" in */*) src="mirror.gcr.io/$img" ;; *) src="mirror.gcr.io/library/$img" ;; esac
            docker pull "$src" && docker tag "$src" "$img"
          done
      - run: deploy/vps-cloudflare/scripts/validate.sh

  ci-ok:
    name: CI OK
    needs: [changes, js, demo-content, php, images, deploy]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fail if any job failed or was cancelled
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: |
          echo "changes=${{ needs.changes.result }} js=${{ needs.js.result }} demo-content=${{ needs.demo-content.result }} php=${{ needs.php.result }} images=${{ needs.images.result }} deploy=${{ needs.deploy.result }}"
          exit 1
      - run: echo "All required jobs passed or were skipped by the path filters."
