name: H5P integration tests

# api-h5p suites that need real Postgres, Valkey and an S3 store (SeaweedFS) (test/http.test.ts, test/pg-storage.test.ts).
# Manual for now; the unit suites run in ci.yml on every change.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  h5p-integration:
    name: api-h5p integration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17.11-alpine
        env:
          POSTGRES_DB: default
          POSTGRES_USER: default
          POSTGRES_PASSWORD: secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U default -d default"
          --health-interval 5s --health-timeout 5s --health-retries 20
      valkey:
        image: valkey/valkey:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      HUSKY: "0"
      COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
      TURBO_TELEMETRY_DISABLED: "1"
      # Defaults in api/h5p/src/config.ts point at compose service names; services are on localhost here.
      DB_HOST: 127.0.0.1
      DB_PORT: "5432"
      DB_DATABASE: default
      DB_USERNAME: default
      DB_PASSWORD: secret
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: "6379"
      S3_ENDPOINT: http://127.0.0.1:8333
      S3_KEY: admin
      S3_SECRET: minio_secretpassword
      S3_BUCKET: ulams
      # Same tag as api/docker-compose.yml and the launcher: scripts/check-pinned-images.mjs fails when they differ.
      SEAWEEDFS_IMAGE: "chrislusf/seaweedfs:4.37"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: yarn

      - name: Install dependencies
        uses: ./.github/actions/setup-yarn

      - name: Download H5P core and editor files
        run: corepack yarn workspace api-h5p download:core

      # A service container cannot take command arguments, so the store is started here (as in api/docker-compose.yml).
      - name: Start SeaweedFS
        run: |
          docker run -d --name storage -p 127.0.0.1:8333:8333 \
            -e AWS_ACCESS_KEY_ID="$S3_KEY" -e AWS_SECRET_ACCESS_KEY="$S3_SECRET" \
            "$SEAWEEDFS_IMAGE" mini -dir=/data -s3.iam.readOnly=false -bucket="$S3_BUCKET"
          for _ in $(seq 1 60); do
            curl -fsS http://127.0.0.1:8333/healthz && exit 0
            sleep 2
          done
          docker logs storage
          echo "::error::SeaweedFS did not become ready"
          exit 1

      - name: Integration tests
        run: corepack yarn test:h5p:integration
