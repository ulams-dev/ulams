<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Poland, measured</title>
<meta name="description" content="35 years of change in Poland, told through public statistics on one map: energy, prosperity, security, business, daily life, mobility, health and people. Every figure links to the institution that published it.">
<meta name="theme-color" content="#000000">
<link rel="stylesheet" href="fonts/fonts.css">
<style>
:root{
  --bg:#000;
  --surface:#05070a;
  --land:#0d1117;
  --land-edge:rgba(255,255,255,.16);
  --ink:#fff;
  --ink-2:rgba(255,255,255,.72);
  --ink-3:rgba(255,255,255,.46);
  --line:rgba(255,255,255,.14);
  --line-2:rgba(255,255,255,.28);
  --pl:#f03a4e;          /* Poland: the focus mark */
  --pl-soft:rgba(240,58,78,.18);
  --ctx:#7d8aa0;         /* comparison marks: deliberately recessive */
  --glow:#ffd9a8;        /* light on the map: energy, people, flows */
  --sans:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --cond:"Barlow Semi Condensed","Barlow",system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  --gut:clamp(16px,4vw,56px);
  color-scheme:dark;
}
:root[data-theme="light"]{color-scheme:dark} /* the piece is night-side by design; a light theme is not offered */
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --bg:#000; } }
:root[data-theme="dark"]{ --bg:#000; }

*{box-sizing:border-box}
html{background:var(--bg);-webkit-text-size-adjust:100%;scroll-behavior:auto}
body{margin:0;background:var(--bg);color:var(--ink);font:400 17px/1.6 var(--sans);overflow-x:hidden;-webkit-font-smoothing:antialiased}
a{color:inherit}
::selection{background:var(--pl);color:#fff}

/* ---------- stage: the map behind everything ---------- */
#stage{position:fixed;top:0;left:0;right:0;height:100vh;z-index:0;overflow:hidden;background:radial-gradient(120% 90% at 70% 40%,#070b12 0%,#000 70%)}
#map,#fx{position:absolute;inset:0;width:100%;height:100%;display:block}
#map .grat path{fill:none;stroke:rgba(255,255,255,.05);stroke-width:1;vector-effect:non-scaling-stroke}
#map .land path{fill:var(--land);stroke:var(--land-edge);stroke-width:.6;vector-effect:non-scaling-stroke;transition:fill .9s ease,stroke .9s ease}
#map .land path.hi{fill:#2a0d13;stroke:var(--pl);stroke-width:1.4}
#map .land path.hi2{fill:#161c26;stroke:rgba(255,255,255,.42);stroke-width:.9}
#stage[data-dim="1"] #map .land path:not(.hi){fill:#080a0e}
#scrim{position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(90deg,rgba(0,0,0,.92) 0,rgba(0,0,0,.78) 440px,rgba(0,0,0,0) 640px),
             linear-gradient(0deg,rgba(0,0,0,.7) 0%,rgba(0,0,0,0) 22%),
             linear-gradient(180deg,rgba(0,0,0,.6) 0%,rgba(0,0,0,0) 14%)}
#stage[data-hero="1"] #scrim{background:linear-gradient(90deg,rgba(0,0,0,.85) 0%,rgba(0,0,0,.35) 50%,rgba(0,0,0,0) 70%),linear-gradient(0deg,rgba(0,0,0,.85) 0%,rgba(0,0,0,0) 35%)}
#tip{position:fixed;z-index:30;max-width:280px;padding:12px 14px;background:rgba(5,7,10,.94);border:1px solid var(--line-2);font:400 13px/1.45 var(--sans);color:var(--ink-2);pointer-events:none;opacity:0;transform:translateY(4px);transition:opacity .15s,transform .15s}
#tip.on{opacity:1;transform:none}
#tip b{display:block;font:500 11px/1.2 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--ink);margin-bottom:6px}

/* ---------- HUD ---------- */
.hud{position:fixed;left:0;right:0;z-index:20;pointer-events:none;font:400 11px/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--ink-2)}
.hud a,.hud button{pointer-events:auto}
#top{top:0;display:flex;align-items:center;gap:28px;padding:18px var(--gut);background:linear-gradient(180deg,rgba(0,0,0,.85),rgba(0,0,0,0))}
.brand{font:600 15px/1 var(--cond);letter-spacing:.32em;color:var(--ink);text-decoration:none;white-space:nowrap;display:flex;align-items:center;gap:12px}
.brand i{display:inline-block;width:18px;height:12px;background:linear-gradient(#fff 50%,var(--pl) 50%)}
#nav{display:flex;gap:22px;flex:1;justify-content:center;overflow:hidden}
#nav a{color:var(--ink-3);text-decoration:none;font:500 12px/1 var(--cond);letter-spacing:.2em;padding:6px 0;border-bottom:1px solid transparent;transition:color .2s,border-color .2s;white-space:nowrap}
#nav a:hover{color:var(--ink)}
#nav a.on{color:var(--ink);border-color:var(--ink)}
.lang{display:flex;border:1px solid var(--line-2)}
.lang button{all:unset;pointer-events:auto;cursor:pointer;padding:8px 12px;font:500 11px/1 var(--mono);letter-spacing:.14em;color:var(--ink-3)}
.lang button[aria-pressed="true"]{background:var(--ink);color:#000}
.lang button:focus-visible{outline:1px solid var(--pl);outline-offset:2px}
#progress{position:fixed;top:0;left:0;height:2px;width:0;background:var(--pl);z-index:21}
#bottom{bottom:0;display:flex;align-items:flex-end;justify-content:space-between;gap:20px;padding:16px var(--gut) 18px}
.tele{display:flex;gap:26px;align-items:flex-end}
.tele div{display:flex;flex-direction:column;gap:7px}
.tele small{font-size:9px;color:var(--ink-3)}
.tele span{color:var(--ink)}
#scalebar{height:6px;border:1px solid var(--ink-2);border-top:none;width:80px;transition:width .3s}
.tminus{text-align:right}
.tminus span{font-size:13px;letter-spacing:.08em}
#chap{color:var(--ink)}

/* ---------- story ---------- */
#story{position:relative;z-index:10;pointer-events:none}
.step{min-height:100vh;display:flex;align-items:center;padding:110px var(--gut) 90px}
.step--chapter{min-height:90vh}
.card{pointer-events:auto;width:min(470px,100%);position:relative}
.card::before,.card::after{content:"";position:absolute;width:14px;height:14px;border:1px solid var(--line-2);pointer-events:none}
.card::before{top:-14px;left:-14px;border-right:none;border-bottom:none}
.card::after{bottom:-14px;right:-14px;border-left:none;border-top:none}
.step--hero .card::before,.step--hero .card::after,.step--chapter .card::before,.step--chapter .card::after{display:none}
.kicker{font:500 11px/1.4 var(--mono);letter-spacing:.18em;text-transform:uppercase;color:var(--ink-3);display:flex;align-items:center;gap:10px;margin:0 0 14px}
.kicker::before{content:"";width:6px;height:6px;background:var(--pl);border-radius:50%;box-shadow:0 0 10px var(--pl);flex:none}
h1,h2,h3{font-family:var(--cond);font-weight:500;text-transform:uppercase;letter-spacing:.03em;margin:0;line-height:1.02;text-wrap:balance}
h2{font-size:clamp(28px,3.1vw,40px);margin-bottom:18px}
.body{color:var(--ink-2);font-size:16.5px;line-height:1.62}
.body p{margin:0 0 14px}
.body b,.body strong{color:var(--ink);font-weight:500}
.caveat{margin:16px 0 0;padding:10px 0 0 14px;border-left:1px solid var(--line-2);font:400 13px/1.5 var(--sans);color:var(--ink-3)}
.caveat::before{content:attr(data-label);display:block;font:500 9.5px/1 var(--mono);letter-spacing:.18em;margin-bottom:6px;color:var(--ink-3)}
.fig{margin:22px 0 4px}
.fig + .fig{margin-top:26px}
.figt{font:500 10.5px/1.4 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);margin:0 0 12px;display:flex;justify-content:space-between;gap:12px}
.fig svg{display:block;width:100%;height:auto;overflow:visible}
.meta{margin-top:20px;display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;font:400 10.5px/1.5 var(--mono);letter-spacing:.06em;color:var(--ink-3)}
.badge{border:1px solid var(--line-2);padding:3px 7px;letter-spacing:.14em;text-transform:uppercase;font-size:9.5px;color:var(--ink-2)}
.meta details{width:100%}
.meta summary{cursor:pointer;list-style:none;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-2);display:inline-flex;gap:8px;align-items:center}
.meta summary::-webkit-details-marker{display:none}
.meta summary::after{content:"+";font-size:13px}
.meta details[open] summary::after{content:"−"}
.meta ol{margin:10px 0 0;padding-left:18px;line-height:1.55}
.meta ol a{color:var(--ink-2);text-decoration:none;border-bottom:1px solid var(--line)}
.meta ol a:hover{color:var(--ink);border-color:var(--ink)}

/* hero */
.step--hero{align-items:flex-end;padding-bottom:16vh}
.step--hero .card{width:min(820px,100%)}
.hero-eyebrow{font:500 12px/1.4 var(--mono);letter-spacing:.24em;text-transform:uppercase;color:var(--ink-2);margin-bottom:22px;display:flex;gap:14px;align-items:center}
@keyframes blink{50%{opacity:.25}}
h1{font-size:clamp(34px,5.2vw,76px);letter-spacing:.02em;line-height:.95;margin-bottom:24px}
h1 em{font-style:normal;color:var(--pl)}
.hero-sub{font:500 clamp(22px,2.6vw,36px)/1.1 var(--cond);text-transform:uppercase;letter-spacing:.03em;margin:-6px 0 24px;color:var(--ink)}
.hero-sub em{font-style:normal;color:var(--pl)}
.lede{font:300 clamp(18px,1.6vw,22px)/1.5 var(--sans);color:var(--ink-2);max-width:640px;margin:0 0 30px}
.byline{font:400 11px/1.6 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3)}
.scrollcue{margin-top:40px;display:inline-flex;align-items:center;gap:14px;font:500 11px/1 var(--mono);letter-spacing:.24em;color:var(--ink-2);text-transform:uppercase}
.scrollcue i{width:1px;height:38px;background:linear-gradient(var(--ink),transparent);position:relative;overflow:hidden}
.scrollcue i::after{content:"";position:absolute;left:-2px;top:-8px;width:5px;height:8px;background:var(--pl);animation:drop 1.8s infinite}
@keyframes drop{to{top:40px}}

/* chapter openers */
.chapno{font:500 clamp(80px,12vw,170px)/.8 var(--cond);color:transparent;-webkit-text-stroke:1px rgba(255,255,255,.5);letter-spacing:.02em;margin-bottom:24px}
.step--chapter h2{font-size:clamp(38px,5vw,68px)}
.step--chapter .lede{margin-top:6px}

/* buttons */
.btns{display:flex;gap:12px;flex-wrap:wrap;margin-top:28px}
.btn{display:inline-flex;align-items:center;gap:10px;padding:15px 22px;border:1px solid var(--ink);color:var(--ink);text-decoration:none;font:500 12px/1 var(--cond);letter-spacing:.22em;text-transform:uppercase;transition:background .2s,color .2s}
.btn:hover,.btn:focus-visible{background:var(--ink);color:#000;outline:none}
.btn--ghost{border-color:var(--line-2);color:var(--ink-2)}

/* KPI tiles */
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:1px;background:var(--line);border:1px solid var(--line)}
.kpis.k3{grid-template-columns:repeat(3,1fr)}
.kpi{background:rgba(0,0,0,.82);padding:14px 14px 13px;position:relative}
.kpi .v{font:500 clamp(24px,2.3vw,32px)/1 var(--cond);letter-spacing:.01em;color:var(--ink);white-space:nowrap}
.kpi .v.pl{color:var(--ink)}
.kpi .l{font:400 11px/1.4 var(--mono);letter-spacing:.06em;color:var(--ink-3);margin-top:8px;text-transform:uppercase}
.kpi::after{content:"";position:absolute;top:10px;right:10px;width:4px;height:4px;border-radius:50%;background:var(--pl);opacity:0}
.run .kpi::after{animation:blink 2.2s infinite;opacity:1}
.hero-kpis{margin-top:4px;max-width:760px}
.hero-kpis.kpis{grid-template-columns:repeat(4,1fr)}

/* svg chart marks */
.trk{stroke:rgba(255,255,255,.09)}
.mk-pl{stroke:var(--pl);fill:var(--pl)}
.mk-ctx{stroke:var(--ctx);fill:var(--ctx)}
.tl{fill:var(--ink-2);font:400 12px var(--sans)}
.tl.b{fill:var(--ink);font-weight:500}
.tv{fill:var(--ink);font:500 13px var(--mono)}
.tm{fill:var(--ink-3);font:400 10px var(--mono);letter-spacing:.1em;text-transform:uppercase}
.ptc{fill:#fff;opacity:0;transition:opacity .4s}
.run .ptc{opacity:.9}
.dot-off{fill:none;stroke:rgba(255,255,255,.22)}
.wd{transition:fill .35s ease,stroke .35s ease}
.tw{animation:tw 3s ease-in-out infinite}
@keyframes tw{50%{opacity:.45}}

/* day timeline */
.day{position:relative;margin:4px 0 0;padding:0 0 0 30px;list-style:none}
.day::before{content:"";position:absolute;left:6px;top:6px;bottom:6px;width:1px;background:var(--line-2)}
.day li{position:relative;padding:0 0 15px;opacity:0;transform:translateX(-6px);transition:opacity .5s,transform .5s}
.run .day li{opacity:1;transform:none}
.day li::before{content:"";position:absolute;left:-28px;top:6px;width:9px;height:9px;border:1px solid var(--ink);background:#000;border-radius:50%}
.day time{font:500 11px/1 var(--mono);letter-spacing:.12em;color:var(--ink);display:block;margin-bottom:4px}
.day span{font-size:14px;color:var(--ink-2)}
.day .runner{position:absolute;left:3.5px;top:0;width:6px;height:6px;border-radius:50%;background:var(--pl);box-shadow:0 0 12px var(--pl);padding:0}
.day .runner::before{display:none}
.run .day .runner{animation:run 6s linear infinite}
@keyframes run{from{top:0}to{top:calc(100% - 6px)}}

/* ledger */
.ledger{display:grid;gap:1px;background:var(--line);border:1px solid var(--line)}
.ledger .row{display:grid;grid-template-columns:1fr 1fr;gap:1px}
.ledger .row>div{background:rgba(0,0,0,.85);padding:12px}
.ledger .hd>div{font:500 9.5px/1.3 var(--mono);letter-spacing:.18em;text-transform:uppercase;color:var(--ink-3);padding:9px 12px}
.ledger h4{margin:0 0 4px;font:500 13px/1.2 var(--cond);letter-spacing:.14em;text-transform:uppercase}
.ledger p{margin:0;font-size:13px;line-height:1.45;color:var(--ink-2)}
.ledger .good p{color:var(--ink)}
.ledger .good p::before{content:"↗ ";color:var(--pl)}

/* sources */
#sources{position:relative;z-index:10;background:#000;border-top:1px solid var(--line);padding:80px var(--gut) 120px}
#sources h2{font-size:28px}
#sources .cols{columns:3 300px;column-gap:40px;margin-top:30px;font:400 12px/1.55 var(--mono);color:var(--ink-3)}
#sources .cols a{color:var(--ink-2);text-decoration:none;display:block;break-inside:avoid;margin-bottom:10px}
#sources .cols a:hover{color:var(--ink)}
#sources .note{max-width:760px;color:var(--ink-3);font-size:14px}

/* table fallback for screen readers */
.sr{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- small screens ---------- */
@media (max-width:1399px){ #nav{gap:14px} #nav a{letter-spacing:.12em;font-size:11px} }
@media (max-width:1179px){ #nav{visibility:hidden} }
@media (max-width:899px){
  #nav{display:none}
  #top{justify-content:space-between;padding:14px 16px}
  .brand{font-size:13px;letter-spacing:.24em}
  #scrim,#stage[data-hero="1"] #scrim{background:linear-gradient(0deg,rgba(0,0,0,.96) 0%,rgba(0,0,0,.82) 42%,rgba(0,0,0,0) 62%),linear-gradient(180deg,rgba(0,0,0,.7) 0%,rgba(0,0,0,0) 14%)}
  .step{align-items:flex-end;padding:52vh 16px 80px;min-height:100vh}
  .step--hero{padding-top:40vh;padding-bottom:12vh}
  .card{width:100%;background:rgba(0,0,0,.86);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);padding:22px 18px 20px;margin:0 -2px;border-top:1px solid var(--line-2)}
  .step--hero .card,.step--chapter .card{background:none;backdrop-filter:none;-webkit-backdrop-filter:none;border:none;padding:0}
  .card::before,.card::after{display:none}
  .tele .hide-m{display:none}
  #bottom{padding:18px 16px 10px;background:linear-gradient(0deg,#000 55%,rgba(0,0,0,0))}
  .hero-kpis.kpis{grid-template-columns:repeat(2,1fr)}
  .kpis.k3{grid-template-columns:repeat(2,1fr)}
  body{font-size:16px}
  .body{font-size:15.5px}
}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}

/* ---------- inside a lesson page (the ulams bridge) and poster mode ----------
   The lesson page owns the narration, the stepper, the language and the About text. "none" chrome shows
   the map and, on the right, only the figures of the current step; "minimal" shows one story card with
   Back and Next. Without a parent window the scroll story above is unchanged. */
/* The lesson page draws its own header and footer over the frame (about 115 px and 70 px): keep the figures clear of them. */
html.ix{--ix-top:128px;--ix-bottom:84px}
html.ix-poster{--ix-top:70px;--ix-bottom:56px}
html.ix,html.ix body{height:100%;overflow:hidden}
.ix #top,.ix #bottom,.ix #progress,.ix #sources{display:none}
.ix #story{position:fixed;inset:0;overflow:auto}
.ix .step{min-height:100%;display:flex;align-items:center;padding:calc(var(--ix-top) + 8px) var(--gut) var(--ix-bottom)}
.ix .step--hero{align-items:center;padding-bottom:40px}
.ix .step .card{pointer-events:auto}
.ix-none #story{inset:auto;top:var(--ix-top);right:24px;bottom:var(--ix-bottom);width:min(380px,30vw);scrollbar-width:thin}
.ix-none #story.empty{display:none}
.ix-none .step{min-height:0;padding:0;display:block}
.ix-none .step .card{width:100%;background:rgba(0,0,0,.82);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border:1px solid var(--line-2);padding:18px 18px 14px}
.ix-none .card::before,.ix-none .card::after{display:none}
.ix-none .card>:not(.fig):not(.caveat):not(.meta){display:none}
.ix-none .fig:first-child{margin-top:0}
.ix-poster #tip,.ix-poster #paneltoggle{display:none}
.stepnav{display:flex;gap:12px;margin-top:22px;pointer-events:auto}
.stepnav button{all:unset;cursor:pointer;padding:12px 16px;border:1px solid var(--line-2);font:500 11px/1 var(--mono);letter-spacing:.16em;text-transform:uppercase;color:var(--ink)}
.stepnav button:hover,.stepnav button:focus-visible{background:var(--ink);color:#000;outline:none}
.stepnav button[disabled]{opacity:.35;cursor:default;background:none;color:var(--ink-3)}
#paneltoggle{all:unset;display:none;position:fixed;top:calc(var(--ix-top) - 4px);right:12px;z-index:30;cursor:pointer;padding:10px 14px;border:1px solid var(--line-2);background:rgba(0,0,0,.8);font:500 11px/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--ink)}
#paneltoggle:focus-visible{outline:2px solid var(--pl);outline-offset:2px}
#paneltoggle[hidden]{display:none}
.no-data #story{display:none}
#fail{position:fixed;inset:0;z-index:40;display:none;align-items:center;justify-content:center;padding:24px;text-align:center;color:var(--ink-2);font:400 15px/1.5 var(--sans)}
.no-data #fail{display:flex}
.reduced *,.reduced *::before,.reduced *::after{animation:none!important;transition:none!important}
.paused *,.paused *::before,.paused *::after{animation-play-state:paused!important}
@media (max-width:899px){
  .ix-none #story{inset:auto;top:calc(var(--ix-top) + 44px);left:10px;right:10px;bottom:auto;width:auto;max-height:46vh;display:none}
  .ix-none.panel-open #story:not(.empty){display:block}
  .ix-none #paneltoggle:not([hidden]){display:block}
  .ix .step{padding:calc(var(--ix-top) - 40px) 16px 24px;align-items:flex-start}
}
</style>
</head>
<body>
<div id="progress"></div>
<div id="stage" data-hero="1">
  <svg id="map" aria-hidden="true"></svg>
  <canvas id="fx" role="img" aria-label="Map of Poland and its surroundings"></canvas>
  <div id="scrim"></div>
</div>
<div id="tip" aria-hidden="true"></div>
<ul id="mlist" class="sr" aria-label="Places on the map"></ul>

<header class="hud" id="top">
  <a class="brand" href="#s-hero"><i></i><span>POLSKA · 2026</span></a>
  <nav id="nav" aria-label="Chapters"></nav>
  <div class="lang" role="group" aria-label="Language">
    <button type="button" data-lang="en" aria-pressed="true">EN</button>
    <button type="button" data-lang="pl" aria-pressed="false">PL</button>
  </div>
</header>

<div class="hud" id="bottom" aria-hidden="true">
  <div class="tele">
    <div><small data-i="lat">Position</small><span id="coords">52°13′N 21°00′E</span></div>
    <div class="hide-m"><small data-i="alt">Altitude</small><span id="alt">—</span></div>
    <div class="hide-m"><small data-i="scale">Scale</small><span><b id="scalebar"></b></span><span id="scaletext" style="margin-top:4px">—</span></div>
  </div>
  <div class="tele">
    <div class="hide-m"><small data-i="chapter">Chapter</small><span id="chap">—</span></div>
    <div class="tminus"><small data-i="tplus">T+ since EU accession · 1 May 2004</small><span id="tplus">—</span></div>
  </div>
</div>

<button id="paneltoggle" type="button" aria-expanded="false" hidden></button>
<main id="story" tabindex="-1"></main>
<p id="fail" role="alert"></p>

<footer id="sources">
  <h2 data-i="srcTitle">Sources</h2>
  <p class="note" data-i="srcNote"></p>
  <div class="cols" id="srclist"></div>
</footer>

<script src="vendor/atlas.js"></script>
<script type="module" src="app.js"></script>
</body>
</html>
