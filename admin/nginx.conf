# nginx-unprivileged: port 8080, runs as uid 101. Security headers and the CSP come from the
# reverse proxy in front (ADR 0044, ADR 0056).
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Health check for orchestrators
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Settings written at container start: never cached
    location = /runtime-config.json {
        add_header Cache-Control "no-store";
        try_files $uri =404;
    }

    # The shell and the service workers must always be revalidated
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
    location ~ ^/(service-worker.*\.js|version)$ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # Hashed bundles (umi.5a8f0db8.js, 1055.f951e8cb.async.js, hashed CSS) never change
    location ~* "\.[0-9a-f]{8}\.(?:async\.)?(?:js|css)$" {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }
    location /static/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Single page app: unknown paths get the shell, missing files with an extension a 404
    location ~ \.[a-zA-Z0-9]+$ {
        try_files $uri =404;
    }
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
