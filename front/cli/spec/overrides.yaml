# Curated names and fixes for the commands generated from spec/openapi.json (plan 4.4).
# Keys under `operations` are "METHOD /path". Supported keys: id, hide, kind, idempotent, scopes,
# positionals, upload, paginated, longRunning, summary, description, examples, output (file|json), mcp.
nouns:
  user-groups: groups
  gift-quizes: quizzes
  gift-questions: questions
  question: questionnaire-questions
  user: users
  stationary-events: events
  bulk-notifications: notifications-bulk

operations:
  # --- access and enrolment (curated commands in src/commands/access.ts cover the course access routes)
  "GET /api/admin/courses/{id}/access": { hide: true }
  "POST /api/admin/courses/{id}/access/add": { hide: true }
  "POST /api/admin/courses/{id}/access/remove": { hide: true }
  "POST /api/admin/courses/{id}/access/set": { hide: true }
  "GET /api/admin/course-access-enquiries": { id: access.enquiries-list }
  "POST /api/admin/course-access-enquiries/approve/{id}": { id: access.enquiries-approve }
  "DELETE /api/admin/course-access-enquiries/{id}": { id: access.enquiries-delete }
  "GET /api/admin/consultation-access-enquiries": { id: consultations.access-enquiries-list }
  "POST /api/admin/consultation-access-enquiries/approve/{proposedTermId}": { id: consultations.access-enquiries-approve }
  "POST /api/admin/consultation-access-enquiries/disapprove/{id}": { id: consultations.access-enquiries-disapprove }

  # --- compliance (certificates, required training, reports)
  "GET /api/admin/compliance/managers": { id: compliance.managers-list }
  "PUT /api/admin/compliance/managers/{user}": { id: compliance.managers-set, summary: "Set or clear (manager_id null) the manager that overdue training escalates to" }
  "GET /api/admin/compliance/paths/{id}": { id: compliance.paths-get }
  "POST /api/admin/compliance/paths/{id}/enrollments": { id: compliance.paths-enroll, summary: "Enrol users in a learning path" }
  "POST /api/admin/compliance/rules/{id}/evaluate": { id: compliance.rules-evaluate, summary: "Preview (default) or run (--dry-run false) an enrolment rule" }
  "GET /api/admin/compliance/report/export": { id: compliance.report-export, output: file, summary: "Download a compliance dataset as CSV or JSON lines (use --out)" }

  # --- courses
  "GET /api/admin/courses/{id}/clone": { id: courses.clone, kind: write, idempotent: false, summary: "Clone a course with its lessons and topics" }
  "GET /api/admin/courses/{id}/export": { id: courses.export, output: file, summary: "Export a course as a .zip (use --out)" }
  "POST /api/admin/courses/zip/import": { id: courses.import, upload: { file: { field: file, accept: [".zip"] } }, summary: "Import a course from an exported .zip" }
  "POST /api/admin/courses/{id}": { id: courses.update, summary: "Update a course (send only the fields to change, plus title)" }

  # --- lessons / topics
  "PUT /api/admin/lessons/{id}": { id: lessons.update }

  # --- scorm, liascript, cmi5, h5p (low level; topics create-* is the usual path)
  "POST /api/admin/scorm/upload": { id: scorm.upload, upload: { zip: { field: zip, accept: [".zip"] } } }
  "POST /api/admin/scorm/parse": { id: scorm.parse, upload: { zip: { field: zip, accept: [".zip"] } }, kind: read, idempotent: true }
  "POST /api/admin/cmi5": { id: cmi5.upload, upload: { file: { field: file, accept: [".zip"] } } }
  "POST /api/admin/liascript": { id: liascript.create }
  # --- interactive packages (topics create-interactive is the usual path, ADR 0086)
  "POST /api/admin/interactive": { id: interactive.create, upload: { file: { field: file, accept: [".zip"] } }, summary: "Upload an interactive package (.zip with ulams-interactive.json)" }
  "POST /api/admin/interactive/{id}/versions": { id: interactive.add-version, upload: { file: { field: file, accept: [".zip"] } }, summary: "Upload a new version of an interactive package" }
  "GET /api/admin/interactive": { id: interactive.list }
  "GET /api/admin/interactive/{id}": { id: interactive.get }
  "GET /api/admin/interactive/{id}/versions": { id: interactive.versions }
  "GET /api/admin/interactive/{id}/preview": { id: interactive.preview }
  "DELETE /api/admin/interactive/{id}": { id: interactive.delete }

  # --- tokens (scoped personal access tokens, ADR 0074)
  "GET /api/auth/tokens": { id: tokens.list }
  "POST /api/auth/tokens": { id: tokens.create, summary: "Create a scoped personal access token (shown once)", examples: [{ title: "A CI token that can edit courses and run the builder, for 30 days", argv: "tokens create --name ci --scopes @ci --expires-in-days 30 --kind ci --json" }, { title: "A read-only token for an agent", argv: "tokens create --name reader --scopes @read-only --kind agent --agent-name claude-code --json" }] }
  "DELETE /api/auth/tokens/{id}": { id: tokens.revoke, positionals: [id] }
  "GET /api/auth/tokens/current": { id: tokens.current }
  "GET /api/admin/tokens": { id: tokens.list-all }
  "DELETE /api/admin/tokens/{id}": { id: tokens.revoke-any, positionals: [id] }
  "GET /api/admin/tokens/{id}/audit": { id: tokens.audit, positionals: [id] }
  "GET /api/admin/agent-audit": { id: tokens.agent-audit }
  "PATCH /api/auth/tokens/{id}": { id: tokens.set-limit, positionals: [id], summary: "Change the per-minute rate limit of one of my tokens (null removes it)" }
  "GET /api/auth/tokens/{id}/usage": { id: tokens.usage, positionals: [id], summary: "Requests per day of one of my tokens and its rate limit window" }
  "PATCH /api/admin/tokens/{id}": { id: tokens.set-limit-any, positionals: [id], summary: "Change the per-minute rate limit of any token" }
  "GET /api/admin/tokens/{id}/usage": { id: tokens.usage-any, positionals: [id], summary: "Requests per day of any token and its rate limit window" }

  # --- outgoing webhooks (7.3); the path parameter names differ, so the generator cannot tell list from get
  "GET /api/admin/webhooks/events": { id: webhooks.events }
  "GET /api/admin/webhooks/endpoints": { id: webhooks.endpoints-list }
  "POST /api/admin/webhooks/endpoints": { id: webhooks.endpoints-create, summary: "Register a webhook endpoint (the signing secret is shown once)", examples: [{ title: "Send course completions to a CRM", argv: "webhooks endpoints-create --url https://crm.example.com/hooks/ulams --events course.completed --json" }] }
  "GET /api/admin/webhooks/endpoints/{endpoint}": { id: webhooks.endpoints-get, positionals: [endpoint] }
  "PUT /api/admin/webhooks/endpoints/{endpoint}": { id: webhooks.endpoints-update, positionals: [endpoint] }
  "DELETE /api/admin/webhooks/endpoints/{endpoint}": { id: webhooks.endpoints-delete, positionals: [endpoint] }
  "POST /api/admin/webhooks/endpoints/{endpoint}/rotate-secret": { id: webhooks.endpoints-rotate-secret, positionals: [endpoint] }
  "POST /api/admin/webhooks/endpoints/{endpoint}/test": { id: webhooks.endpoints-test, positionals: [endpoint], summary: "Send one sample event and show the receiver's answer" }
  "GET /api/admin/webhooks/deliveries": { id: webhooks.deliveries-list }
  "GET /api/admin/webhooks/deliveries/{delivery}": { id: webhooks.deliveries-get, positionals: [delivery] }
  "POST /api/admin/webhooks/deliveries/{delivery}/replay": { id: webhooks.deliveries-replay, positionals: [delivery], summary: "Send a delivery again (same event id, fresh signature)" }

  # --- knowledge export (7.6)
  "GET /api/admin/knowledge/exports": { id: knowledge.exports-list }
  "POST /api/admin/knowledge/exports": { id: knowledge.exports-create, summary: "Start a knowledge pack export of one course or of the whole tenant", examples: [{ title: "Export one course for company RAG", argv: "knowledge exports-create --scope course --course-id 12 --json" }] }
  "GET /api/admin/knowledge/exports/{export}": { id: knowledge.exports-get, positionals: [export] }
  "GET /api/admin/knowledge/exports/{export}/download": { id: knowledge.exports-download, positionals: [export], output: file, summary: "Download manifest.json, chunks.jsonl or index.json of a ready export (use --out)" }
  "GET /api/admin/knowledge/courses/{course}/latest": { id: knowledge.latest, positionals: [course], summary: "The latest ready export of a course" }

  # --- users
  "PUT /api/admin/user/{id}": { id: users.update }
  "PATCH /api/admin/user/{id}": { id: users.patch }

  # --- duplicates the generator could not name
  "GET /api/admin/lti/platforms": { id: lti.platforms-list }
  "GET /api/admin/lti/platforms/{platform}": { id: lti.platforms-get }
  "GET /api/admin/lti/tools": { id: lti.tools-list }
  "GET /api/admin/lti/tools/{tool}": { id: lti.tools-get }
  "GET /api/dictionaries/{slug}/words": { id: public.dictionaries-words-list }
  "GET /api/dictionaries/{slug}/words/{id}": { id: public.dictionaries-words-get }
  "GET /api/lti/platform/ags/{course}/lineitems": { id: public.lti-lineitems-list }
  "GET /api/lti/platform/ags/{course}/lineitems/{lineItem}": { id: public.lti-lineitems-get }
  "GET /api/pdfs/fonts": { id: public.pdfs-fonts-list }
  "GET /api/pdfs/fonts/{file}": { id: public.pdfs-fonts-get }
  "DELETE /api/profile": { id: my.profile-delete-account, kind: destructive }
  "GET /api/profile/delete/{userId}/{token}": { id: my.profile-delete-confirm, kind: destructive }
  "GET /api/questionnaire/{model_type_title}/{model_id}": { id: my.questionnaire-list }
  "GET /api/questionnaire/{model_type_title}/{model_id}/{id}": { id: my.questionnaire-get }
  "POST /api/scorm/track/{uuid}": { id: my.scorm-track-save }
  "GET /api/scorm/track/{scoId}/{key}": { id: my.scorm-track-get }
  "GET /api/events": { id: public.events-feed }

  # --- covered by hand-written commands (login) or renamed
  "POST /api/auth/login": { hide: true }
  "POST /api/demo/login": { hide: true }
  "POST /api/auth/device/code": { hide: true }
  "POST /api/auth/device/token": { hide: true }
  "GET /api/admin/settings/{id}": { id: settings.get-by-id }
  "GET /api/meta": { id: meta }
