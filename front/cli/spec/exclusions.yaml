# Operations deliberately without a CLI command, by reason (plan 4.10). "METHOD /path" or "* /prefix*".
# `ulams api` can still call them; they do not count as coverage.
inbound-webhook: []
browser-only:
  - "GET /api/certificates/verify/*"
  - "GET /api/auth/social/*"
  - "POST /api/auth/social/complete/*"
  - "GET /api/auth/email/verify/*"
  - "GET /api/consultations/approve-term/*"
  - "GET /api/consultations/reject-term/*"
  - "GET /api/profile/delete/*"
  - "* /api/images/img"
  - "GET /api/courses/{id}/scorm"
  - "* /api/lti/tool/*"
  - "* /api/lti/platform/*"
  - "POST /api/lti/launches/*"
content-runtime:
  - "* /api/scorm/assets/*"
  - "* /api/scorm/content/*"
  - "POST /api/scorm/launch/*"
  - "GET /api/scorm/play/*"
  - "GET /api/scorm/show/*"
  - "* /api/scorm/track/*"
  - "* /api/cmi5/*"
  - "POST /api/liascript/launches/*"
  - "POST /api/liascript/progress/*"
  - "POST /api/interactive/launches/*"
  - "GET /api/interactive/showcase"
  - "POST /api/interactive/topics/{topic}/events"
  - "POST /api/courses/progress/{topic_id}/h5p"
  - "* /api/pdfs/fonts*"
internal:
  - "GET /api/health-check"
  - "GET /api/lti/jwks"
deprecated:
  - "GET /api/tags/uniqueTags"
not-for-cli:
  # learner-owned data and player signals; the learner frontend calls them (Learner Insights, plan phase-4 §11.2)
  - "* /api/learner-insights/*"
  # thresholds are tenant and course settings; a CLI command comes with the studio insights page (M4.6)
  - "* /api/admin/learner-insights/*"
