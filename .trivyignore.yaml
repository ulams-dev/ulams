# Accepted Trivy findings. Every entry needs a reason (statement) and an expiry (expired_at, YYYY-MM-DD);
# `node scripts/check-trivyignore.mjs` (CI) fails on a missing field or an expired entry, so nothing is
# ignored for ever. Review rules: SECURITY.md "Patch policy". Format: https://trivy.dev/docs/latest/configuration/filtering/
misconfigurations:
  - id: DS-0002
    paths:
      - api/Dockerfile
      - api/Dockerfile.develop
      - api/docker/php/Dockerfile
    statement: >-
      The PHP images run supervisord as root (it starts php-fpm, Horizon, the scheduler and queue workers
      from one entrypoint), and the pool workers drop to their own user. Running the whole image as non-root
      needs a change of the entrypoint and of the writable paths and belongs to the Helm chart work (P8-5,
      securityContext). Until then the hardening guide recommends dropping capabilities and a read-only
      root filesystem where it works.
    expired_at: 2027-10-21

