name: Accessibility Axe

on:
  pull_request:
    paths:
      - front/**

permissions:
  contents: read

concurrency:
  group: a11y-axe-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  a11y-check:
    name: Run Accessibility Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: yarn
      - name: Install dependencies
        run: yarn install --frozen-lockfile
      - name: Run Accessibility Tests
        # TODO(owner: add the script)
        run: yarn workspace @ulams/web a11y
