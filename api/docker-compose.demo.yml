# Demo profile of the api container (`make demo-up`, back with `make dev-up`): production PHP
# settings, cached config/routes/events, APP_DEBUG=false and vendor/ inside the Docker VM
# instead of on the macOS bind mount. Code edits need `make dev-reload`. See php-profile.sh.
services:
  api:
    environment:
      - DEMO_PERF=1
      - APP_DEBUG=false
      - LOG_LEVEL=warning
      # package manifest of this vendor/, inside the volume (see php-profile.sh)
      - APP_PACKAGES_CACHE=/var/www/html/vendor/.ulams-bootstrap/packages.php
      - APP_SERVICES_CACHE=/var/www/html/vendor/.ulams-bootstrap/services.php
    volumes:
      - api_vendor:/var/www/html/vendor
      # framework caches of this profile stay in the container: the bind-mounted bootstrap/cache
      # is what development, tests and the host see (gecche/laravel-multidomain cannot move the
      # per-domain cache files with APP_*_CACHE)
      - api_bootstrap_cache:/var/www/html/bootstrap/cache

volumes:
  api_vendor:
  api_bootstrap_cache:
