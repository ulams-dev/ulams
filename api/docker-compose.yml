networks:
  ulams:
    name: ulams
    driver: bridge
  # Adapt build worker (profile adapt): reachable from the API only, no route to the internet.
  adapt_build:
    internal: true
volumes:
  h5p_libraries:
services:
  caddy:
    image: caddy
    volumes:
      - ./docker/conf/Caddyfile:/etc/caddy/Caddyfile
      - ./caddy/certs:/etc/caddy/certs
      - ./caddy/data:/data
      - ./caddy/config:/config
    networks:
      - ulams
    ports:
      - "80:80"
      - "443:443"
    # admin (:8000) and front (:3000) run from source on the host (`yarn dev`)
    extra_hosts:
      - "host.docker.internal:host-gateway"
  api:
    # image: escolalms/php:8.4-alpine ## or escolalms/php:8-work for debugginh
    # command: sleep infinity
    build:
      context: .
      dockerfile: Dockerfile.develop
    environment:
      - LARAVEL_APP_NAME=Ulams
      - LARAVEL_APP_ENV=local
      - LARAVEL_APP_KEY=base64:jgaCduGIEEmn4/UMJR5d38Y5ncfNE+rXqV3Fvewd37w=
      - LARAVEL_APP_DEBUG=true
      - LARAVEL_APP_LOG_LEVEL=debug
      - LARAVEL_APP_URL=http://api.localhost
      - LARAVEL_DB_CONNECTION=pgsql
      - LARAVEL_DB_HOST=postgres
      - LARAVEL_DB_PORT=5432
      - LARAVEL_DB_DATABASE=default
      - LARAVEL_DB_USERNAME=default
      - LARAVEL_DB_PASSWORD=secret
      - LARAVEL_REDIS_HOST=redis
      - LARAVEL_REDIS_PASSWORD=ulams
      - LARAVEL_REDIS_PORT=6379
      - LARAVEL_BROADCAST_DRIVER=log
      - LARAVEL_CACHE_DRIVER=redis
      - LARAVEL_SESSION_DRIVER=cookie
      - LARAVEL_QUEUE_DRIVER=redis
      - LARAVEL_QUEUE_CONNECTION=redis
      - LARAVEL_MAIL_DRIVER=smtp
      - LARAVEL_MAIL_HOST=mailhog
      - LARAVEL_MAIL_PORT=1025
      - LARAVEL_MAIL_USERNAME=null
      - LARAVEL_MAIL_PASSWORD=null
      - LARAVEL_MJML_BINARY_PATH=/usr/bin/mjml
      - LARAVEL_TRACKER_ENABLED=false
      - LARAVEL_FILESYSTEM_DRIVER=s3
      - LARAVEL_AWS_ACCESS_KEY_ID=admin
      - LARAVEL_AWS_SECRET_ACCESS_KEY=minio_secretpassword
      - LARAVEL_AWS_DEFAULT_REGION=us-east-1
      - LARAVEL_AWS_BUCKET=ulams
      # Intenal Docker address
      - LARAVEL_AWS_ENDPOINT="http://minio:9000"
      - LARAVEL_AWS_URL="http://storage.localhost/ulams"
      - LARAVEL_AWS_USE_PATH_STYLE_ENDPOINT=true
      - LARAVEL_INITIAL_USER_PASSWORD=secret
      # H5P service (api/h5p), server-to-server; same token as H5P_INTERNAL_TOKEN of the h5p service
      - LARAVEL_H5P_SERVICE_URL=http://h5p:8080
      - LARAVEL_H5P_INTERNAL_TOKEN=ulams-h5p-internal-dev-token
      # Platform content origin (SCORM/LiaScript players, docs/content-origin.md); tenants get theirs from ulams:tenant:sync-env
      - LARAVEL_CONTENT_ORIGIN=http://content.localhost
      # PDF renderer (api/pdf), server-to-server; same token as PDF_INTERNAL_TOKEN of the pdf service
      - LARAVEL_PDF_SERVICE_URL=http://pdf:3000
      - LARAVEL_PDF_INTERNAL_TOKEN=ulams-pdf-internal-dev-token
      # Adapt Path B build worker (api/adapt-builder, profile adapt); off unless ADAPT_SOURCE_ENABLED=true
      - LARAVEL_ADAPT_BUILDER_URL=http://adapt-builder:8080
      - LARAVEL_ADAPT_BUILDER_TOKEN=ulams-adapt-builder-dev-token
    volumes:
      - ./:/var/www/html
    networks:
      - ulams
      - adapt_build

  # H5P player/editor/content API (Lumi h5p-nodejs-library), see h5p/README.md.
  # Browsers reach it same-origin at http://<tenant>.localhost/h5p/* (and
  # http://api.localhost/h5p/* for the platform) through Caddy. Multi-tenant:
  # the host selects the Laravel env file (.env.<host>, platform .env) and the
  # Passport key (storage/<host_with_underscores>/oauth-public.key), read from
  # the read-only mount of this directory and reloaded when they change.
  # The image is built from the repository root (yarn workspace).
  h5p:
    build:
      context: ..
      dockerfile: api/h5p/Dockerfile
    image: ulams/h5p:dev
    restart: unless-stopped
    # Group of the storage files (www-data, gid 82 in the php image): the Passport public keys are
    # 0640 because Passport 13 rejects world-readable key files.
    group_add:
      - "82"
    networks:
      - ulams
    depends_on:
      - postgres
      - redis
      - minio
    environment:
      PORT: 8080
      LOG_LEVEL: info
      PUBLIC_URL: http://api.localhost
      TENANCY_MODE: env-files
      ENV_DIR: /laravel
      KEYS_DIR: /laravel/storage
      PLATFORM_HOSTS: api.localhost
      # Each tenant also allows http(s)://<slug>.app.localhost and http(s)://<slug>.admin.localhost
      # (TENANT_FRONT_ORIGIN_PATTERNS) for CORS and as frame-ancestors of the embed pages.
      # admin (:8000) and front (:3000) run on the host.
      CORS_ORIGINS: http://localhost:3000,http://localhost:8000,http://api.localhost
      # DB_* / S3_* below are only used with TENANCY_MODE=single; in env-files mode each tenant's
      # DB_* and AWS_* come from its env file (S3 credentials fall back to S3_KEY / S3_SECRET).
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: default
      DB_USERNAME: default
      DB_PASSWORD: secret
      DB_SCHEMA: h5p
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ulams
      REDIS_DB: 0
      REDIS_KEY_PREFIX: "h5p:"
      S3_ENDPOINT: http://minio:9000
      S3_REGION: us-east-1
      S3_KEY: admin
      S3_SECRET: minio_secretpassword
      S3_BUCKET: ulams
      S3_PREFIX: h5p
      S3_FORCE_PATH_STYLE: "true"
      JWT_PUBLIC_KEY_PATH: /laravel/storage/oauth-public.key
      # Profile calls go to Caddy with Host = the tenant's API host.
      LARAVEL_API_URL: http://caddy
      LARAVEL_API_HOST: api.localhost
      # Fallback when a tenant env file has no H5P_INTERNAL_TOKEN.
      H5P_INTERNAL_TOKEN: ulams-h5p-internal-dev-token
      H5P_MAX_FILE_SIZE_MB: 64
      H5P_MAX_TOTAL_SIZE_MB: 256
    volumes:
      - h5p_libraries:/data/libraries
      # Laravel env files (.env, .env.<host>) and storage/**/oauth-public.key, read-only.
      - ./:/laravel:ro

  # PDF renderer (pdfme, MIT) for certificates and PDF templates, see pdf/README.md.
  # Internal only: Laravel calls POST /render with X-Internal-Token; browsers never
  # reach it (the admin designer loads fonts through /api/pdfs/fonts).
  # The image is built from the repository root (yarn workspace).
  pdf:
    build:
      context: ..
      dockerfile: api/pdf/Dockerfile
    image: ulams/pdf:dev
    restart: unless-stopped
    networks:
      - ulams
    environment:
      PORT: 3000
      LOG_LEVEL: info
      PDF_INTERNAL_TOKEN: ulams-pdf-internal-dev-token
      PDF_MAX_BODY_SIZE: 5mb
      PDF_MAX_INPUTS: 100
      PDF_RENDER_TIMEOUT_MS: 20000
      PDF_MAX_CONCURRENCY: 2
      PDF_MAX_QUEUE: 16

  # ulams_queue_cron:
  #   command: "./init.sh"
  #   image: escolalms/php:8.2-prod ## or escolalms/php:8-work for debugginh
  #   environment:
  #     - LARAVEL_APP_NAME=Ulams
  #     - LARAVEL_APP_ENV=local
  #     - LARAVEL_APP_KEY=base64:jgaCduGIEEmn4/UMJR5d38Y5ncfNE+rXqV3Fvewd37w=
  #     - LARAVEL_APP_DEBUG=true
  #     - LARAVEL_APP_LOG_LEVEL=debug
  #     - LARAVEL_APP_URL=http://api.localhost
  #     - LARAVEL_DB_CONNECTION=pgsql
  #     - LARAVEL_DB_HOST=postgres
  #     - LARAVEL_DB_PORT=5432
  #     - LARAVEL_DB_DATABASE=default
  #     - LARAVEL_DB_USERNAME=default
  #     - LARAVEL_DB_PASSWORD=secret
  #     - LARAVEL_REDIS_HOST=redis
  #     - LARAVEL_REDIS_PASSWORD=ulams
  #     - LARAVEL_REDIS_PORT=6379
  #     - LARAVEL_BROADCAST_DRIVER=log
  #     - LARAVEL_CACHE_DRIVER=redis
  #     - LARAVEL_SESSION_DRIVER=cookie
  #     - LARAVEL_QUEUE_DRIVER=redis
  #     - LARAVEL_QUEUE_CONNECTION=redis
  #     - LARAVEL_MAIL_DRIVER=smtp
  #     - LARAVEL_MAIL_HOST=mailhog
  #     - LARAVEL_MAIL_PORT=1025
  #     - LARAVEL_MAIL_USERNAME=null
  #     - LARAVEL_MAIL_PASSWORD=null
  #     - LARAVEL_MJML_BINARY_PATH=/usr/bin/mjml
  #     - LARAVEL_TRACKER_ENABLED=false
  #     - LARAVEL_FILESYSTEM_DRIVER=s3
  #     - LARAVEL_AWS_ACCESS_KEY_ID=masoud
  #     - LARAVEL_AWS_SECRET_ACCESS_KEY=tg9t712TG1Odn17fisxXM9y01YrD
  #     - LARAVEL_AWS_DEFAULT_REGION=us-east-1
  #     - LARAVEL_AWS_BUCKET=ulams
  #     - LARAVEL_AWS_ENDPOINT="http://minio:9000"
  #     - LARAVEL_AWS_URL="http://storage.localhost:1001/ulams"
  #     - LARAVEL_AWS_USE_PATH_STYLE_ENDPOINT=true
  #   volumes:
  #     - ./:/var/www/html
  #   networks:
  #     - ulams

  postgres:
    image: postgres:12
    # ports:
    #   - "5432:5432"
    networks:
      - ulams
    volumes:
      - ./docker/postgres-data:/var/lib/postgresql/data
      - ./docker/postgres-backups:/var/lib/postgresql/backups
    environment:
      - "POSTGRES_DB=${POSTGRES_DB:-default}"
      - "POSTGRES_USER=${POSTGRES_USER:-default}"
      - "POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-secret}"
      - TZ=Europe/Warsaw

  adminer:
    networks:
      - ulams
    image: adminer
    ports:
      - 8078:8080

  mailhog:
    networks:
      - ulams
    image: mailhog/mailhog
    logging:
      driver: "none" # disable saving logs
    ports:
      #- 1025:1025 # smtp server
      - 8025:8025 # web ui

  # Valkey (BSD-3-Clause) is a drop-in, Redis-protocol compatible server; Redis 8 is RSALv2/SSPLv1/AGPLv3.
  redis:
    networks:
      - ulams
    image: "valkey/valkey:8-alpine"
    command: "valkey-server --requirepass ${REDIS_PASSWORD:-ulams}"

  mjml:
    image: danihodovic/mjml-server

    # ports:
    #   - 8080:80

  minio:
    # bitnami/* images were removed from Docker Hub; the same image lives under bitnamilegacy/*
    image: bitnamilegacy/minio:latest
    networks:
      - ulams
    # ports:
    #   - "9000:9000"
    #   - "9001:9001"
    volumes:
      - ./docker/minio_storage:/bitnami/minio/data
      - ./docker/conf/minio:/docker-entrypoint-initdb.d
    environment:
      # "<bucket>:download" makes the platform bucket publicly readable (files are served by URL)
      MINIO_DEFAULT_BUCKETS: "${MINIO_DEFAULT_BUCKETS:-ulams:download}"
      MINIO_ROOT_USER: "${MINIO_ROOT_USER:-admin}"
      MINIO_ROOT_PASSWORD: "${MINIO_ROOT_PASSWORD:-minio_secretpassword}"
      # AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}:admin
      # AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}:minio_secretpassword
      # AWS_BUCKET: ${AWS_BUCKET}:ulams"
      # AWS_ENDPOINT: ${AWS_ENDPOINT}

  # Optional virus scanning of uploads (packages/uploads, UPLOADS_SCANNER=clamd).
  # ClamAV is GPL-2.0 and runs as a separate process. Start with: docker compose --profile av up -d clamav
  clamav:
    image: clamav/clamav:1.4
    profiles: ["av"]
    networks:
      - ulams

  # Adapt Path B build worker (ADR 0013, api/adapt-builder/README.md). GPL-3.0, separate program.
  # Off by default: docker compose --profile adapt up -d adapt-builder, and ADAPT_SOURCE_ENABLED=true
  # in the API env. Internal network only (no internet), read-only root, one build at a time.
  adapt-builder:
    build:
      context: ./adapt-builder
    image: ulams/adapt-builder:dev
    profiles: ["adapt"]
    restart: unless-stopped
    networks:
      - adapt_build
    environment:
      ADAPT_BUILDER_TOKEN: ulams-adapt-builder-dev-token
      ADAPT_BUILD_TIMEOUT_MS: 240000
    read_only: true
    tmpfs:
      - /tmp:exec,size=1g
    cpus: 1.0
    mem_limit: 1536m
    pids_limit: 256

  soketi:
    image: quay.io/soketi/soketi:latest
    networks:
      - ulams
    expose:
      - "6001"
      - "9601"
    environment:
      SOKETI_DEFAULT_APP_ID: uuid
      SOKETI_DEFAULT_APP_KEY: key_TEST
      SOKETI_DEFAULT_APP_SECRET: secret_TEST
      SOKETI_ADAPTER: redis
      SOKETI_REDIS_HOST: redis
      SOKETI_REDIS_PORT: 6379
      SOKETI_REDIS_PASSWORD: ulams
      SOKETI_METRICS_SERVER_PORT: 9601
      SOKETI_METRICS_ENABLED: 1
