# Unprivileged: port 8080, every writable path under /var/lib/nginx and /run/nginx.
pid /run/nginx/nginx.pid;
error_log /dev/stderr warn;
worker_processes auto;

events { worker_connections 512; }

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log off;
  client_body_temp_path /var/lib/nginx/tmp/client_body;
  proxy_temp_path /var/lib/nginx/tmp/proxy;
  fastcgi_temp_path /var/lib/nginx/tmp/fastcgi;
  uwsgi_temp_path /var/lib/nginx/tmp/uwsgi;
  scgi_temp_path /var/lib/nginx/tmp/scgi;
  server_tokens off;
  client_max_body_size 2m;

  server {
    listen 8080;
    root /var/www/sylius/public;

    location / { try_files $uri /index.php$is_args$args; }

    location ~ ^/index\.php(/|$) {
      fastcgi_pass 127.0.0.1:9000;
      fastcgi_split_path_info ^(.+\.php)(/.*)$;
      include fastcgi_params;
      fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
      fastcgi_param DOCUMENT_ROOT $realpath_root;
      fastcgi_read_timeout 60s;
      internal;
    }

    location ~ \.php$ { return 404; }
  }
}
