; Pool defaults of the ulams PHP image. Files in php-fpm.d are read in name order and later
; values win, so www.conf (pm sizing) and the app's php-fpm-custom.conf
; (request_terminate_timeout = 3600s) override anything set here.
[global]
log_level = notice

[www]
listen.backlog = 1024
pm.max_requests = 500
pm.process_idle_timeout = 10s
request_terminate_timeout = 120s
; Upload progress is unused and is the entry point of CVE-2026-109619 (php.net advisory 2026-10-21-5).
; php_admin_value applies before request parsing and cannot be changed by ini_set() or .user.ini.
php_admin_value[session.upload_progress.enabled] = 0
