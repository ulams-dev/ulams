; Demo profile (DEMO_PERF=1) on a developer machine: smaller opcache than the production ini, which
; sizes it for a server. One opcache is shared by every php-fpm child, and every CLI process maps its
; own (the file cache feeds it), so these numbers count per process. The code of all tenants is the
; same files, ~2,000 of them loaded per request.
opcache.memory_consumption = 192
opcache.interned_strings_buffer = 16
opcache.jit_buffer_size = 32M
