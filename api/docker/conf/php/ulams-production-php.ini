; Production PHP settings, on top of ulams-custom-php.ini. Copied by the production image
; (Dockerfile) and, at container start, by init.sh when DEMO_PERF=1 (demo profile).

[PHP]
display_errors = Off
display_startup_errors = Off
html_errors = Off
realpath_cache_size = 4096k
realpath_cache_ttl = 600

[opcache]
; Code does not change inside a running container: no stat() of every included file. A deploy
; is a new container; in the demo profile `make dev-reload` resets opcache.
opcache.validate_timestamps = 0
opcache.memory_consumption = 256
opcache.interned_strings_buffer = 32
; vendor/ + packages/ have ~60,000 PHP files; ~2,000 are loaded per request
opcache.max_accelerated_files = 40000
opcache.jit = tracing
opcache.jit_buffer_size = 64M
