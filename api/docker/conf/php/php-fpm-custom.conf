[global]
; JSON log lines are longer than the 1024 default and must not be cut
log_limit = 16384

[www]
; The timeout for serving a single request after which the worker process will be killed.
; This option should be used when the 'max_execution_time' ini option does not stop script
; execution for some reason.
request_terminate_timeout = 3600s

; worker stderr (the stderr_json log channel) reaches the container log as written
catch_workers_output = yes
decorate_workers_output = no
