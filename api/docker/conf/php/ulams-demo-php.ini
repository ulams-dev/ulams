; Demo profile (DEMO_PERF=1) extras for the CLI: queue workers, the scheduler loop and artisan
; reuse compiled scripts from a file cache instead of compiling ~2,000 files per process start.
; `make dev-reload` empties it.
opcache.enable_cli = 1
opcache.file_cache = /tmp/opcache
opcache.file_cache_consistency_checks = 1
