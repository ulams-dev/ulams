<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sky safari — Night Sky Explorers</title>
<script src="cmi5-lite.js"></script>
<style>
  :root { --night:#13153A; --yellow:#FFD23F; --coral:#FF6B6B; --mint:#3DDC97; --lilac:#9B8CFF; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--night); color:#fff; font:18px/1.45 "Nunito", system-ui, sans-serif; }
  main { max-width:560px; margin:0 auto; padding:20px 16px 40px; }
  h1 { font:800 30px/1.1 "Baloo 2", "Fredoka", system-ui, sans-serif; margin:0 0 6px; }
  .bubble { background:#fff; color:var(--night); border-radius:20px; padding:12px 16px; border:3px solid var(--yellow); margin:12px 0; }
  .status { font-size:13px; opacity:.7; }
  .card { display:flex; align-items:center; gap:14px; min-height:64px; padding:10px 14px; margin:10px 0; border-radius:20px; border:3px solid rgba(255,255,255,.25); cursor:pointer; }
  .card input { width:28px; height:28px; accent-color:var(--mint); }
  .card.on { border-color:var(--mint); background:rgba(61,220,151,.12); }
  .card .emoji { font-size:28px; }
  textarea { width:100%; min-height:80px; border-radius:16px; border:3px solid rgba(255,255,255,.25); background:transparent; color:#fff; font:inherit; padding:10px; }
  button { min-height:52px; width:100%; border-radius:26px; border:0; background:var(--yellow); color:var(--night); font:800 18px system-ui; cursor:pointer; margin-top:14px; }
  button.ghost { background:transparent; color:#fff; border:3px solid rgba(255,255,255,.4); }
  .badge { text-align:center; font:800 26px "Baloo 2", system-ui; color:var(--yellow); margin-top:16px; }
</style>
</head>
<body>
<main>
  <h1>Sky safari</h1>
  <div class="status" id="status">connecting…</div>
  <div class="bubble">Go outside with a grown-up after dark. Let your eyes get used to the dark for 10 minutes (no screens!). Then tick what you spot.</div>
  <form id="list"></form>
  <label for="notes">What else did you see? Draw it in your notebook or write it here.</label>
  <textarea id="notes" placeholder="I saw a red star low in the east…"></textarea>
  <button id="submit" type="button">Check in my safari!</button>
  <button id="exit" type="button" class="ghost">Back to my mission map</button>
  <div class="badge" id="badge" aria-live="polite"></div>
</main>
<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var items = [
    ['🌙', 'I saw the Moon', 'Is it a crescent, half or full Moon? Check your Moon diary.'],
    ['🥄', 'I found the Big Dipper', 'Seven bright stars shaped like a spoon, low in the north.'],
    ['⭐', 'I found the North Star', 'Follow the two end stars of the Dipper\'s bowl upwards.'],
    ['W', 'I found Cassiopeia', 'A big W high in the sky.'],
    ['🪐', 'I spotted a planet', 'Planets do not twinkle. Saturn and Jupiter are bright this autumn.'],
    ['☄️', 'I saw a shooting star (bonus!)', 'Meteors are tiny space rocks burning up in the air.']
  ];
  items.forEach(function (it, i) {
    var label = document.createElement('label'); label.className = 'card';
    label.innerHTML = '<input type="checkbox" id="i' + i + '"><span class="emoji" aria-hidden="true">' + it[0] + '</span><span><strong>' + it[1] + '</strong><br><small>' + it[2] + '</small></span>';
    $('list').appendChild(label);
    label.querySelector('input').addEventListener('change', function (e) {
      label.classList.toggle('on', e.target.checked);
      var n = document.querySelectorAll('#list input:checked').length;
      Cmi5.progress(Math.min(100, n / 4 * 100), it[1]);
    });
  });
  $('submit').onclick = function () {
    var n = document.querySelectorAll('#list input:checked').length;
    if (n < 2) { $('badge').textContent = 'Spot at least two things, explorer!'; return; }
    $('badge').textContent = n >= 4 ? '★ Star Finder badge unlocked! ★' : 'Great safari! Find ' + (4 - n) + ' more for the Star Finder badge.';
    Cmi5.complete().then(function () { return Cmi5.pass(Math.min(1, n / 4)); });
  };
  $('exit').onclick = function () { Cmi5.exit(); };
  Cmi5.start().then(function (ok) { $('status').textContent = ok ? 'Your teacher can see your check-ins ✓' : 'Practice mode (not saved)'; });
})();
</script>
</body>
</html>
