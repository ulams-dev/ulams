# Local trial on a laptop or in CI (scripts/install.sh --local): no Cloudflare, no real domain, plain
# HTTP on 127.0.0.1, SeaweedFS standing in for R2. Never use on a server.
#
#   docker compose -p ulams-local --env-file .env -f compose.yml -f compose.local.yml up -d
#
# Hosts end in .localhost and resolve to 127.0.0.1 in browsers and curl; the port is
# ULAMS_PORT_SUFFIX (default :8480), for example http://api.ulams.localhost:8480/api/health.

services:
  caddy:
    ports:
      - "127.0.0.1:${LOCAL_HTTP_PORT:-8480}:80"
  # SeaweedFS (ADR 0041). The API creates one identity per tenant through its IAM API, which is on the S3 port.
  storage:
    image: chrislusf/seaweedfs:4.37
    restart: unless-stopped
    command:
      - mini
      - -dir=/data
      - -s3.iam.readOnly=false
      - -bucket=${S3_PLATFORM_BUCKET:-ulams}
    environment:
      AWS_ACCESS_KEY_ID: ${S3_KEY}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET}
    ports:
      - "127.0.0.1:${LOCAL_S3_PORT:-9190}:8333"
    volumes:
      - storage_data:/data
    deploy:
      resources:
        limits:
          memory: 512M
volumes:
  storage_data:
